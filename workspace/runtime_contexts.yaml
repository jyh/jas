runtime_contexts:

  active_document:
    description: >
      Properties of the currently active document tab. When no tab is
      open (active_tab == -1), all properties resolve to their defaults.
    defaults:
      is_modified: false
      has_filename: false
      filename: ""
      any_modified: false
      has_selection: false
      selection_count: 0
      can_undo: false
      can_redo: false
      zoom_level: 1.0
      view_offset_x: 0.0
      view_offset_y: 0.0
      layers_panel_selection_count: 0
      layers_panel_selection_is_container: false
      layers_panel_selection_has_group: false
      selection_has_brushed_stroke: false
      selection_is_single_brushed_stroke: false
      artboards_count: 0
      artboards_panel_selection_ids: []
      element_tree: null
      element_selection: []
      recent_colors: []
    properties:
      recent_colors:
        type: list
        item_type: color
        writable: true
        description: >
          Per-document list of recently committed colors, newest first,
          capped at 10 entries. Every entry is "#rrggbb", lowercase,
          whatever form the push was given, so `unique` finds one colour
          however it was spelled. The ONE writable active_document property:
          `set_active_color` pushes onto it (`list_push` target
          `active_document.recent_colors`, unique, max 10), and the Color and
          Swatches panels both read it, so the two strips always agree.
          Added on commit (slider release, hex field Enter, swatch click
          including none/black/white). Empty slots render as hollow squares
          with a solid border. Until 2026-10-12 this was a PANEL key, so the
          push landed in whichever panel was active and a menu dispatch
          dropped it.
      is_modified:
        type: bool
        description: "The active document has unsaved changes"
      has_filename:
        type: bool
        description: "The active document has been saved to a file at least once"
      filename:
        type: string
        description: "The name the active document's tab shows: its file name once saved, `Untitled-N` until then (has_filename says which). The empty string only when no document is open. Save Changes shows it."
      any_modified:
        type: bool
        description: "Any open document has unsaved changes"
      paragraph_wrappers:
        type: object
        description: "The Justification dialog's eleven fields and the Hyphenation dialog's eight as the selected paragraphs hold them: the value every selected paragraph agrees on, null where they differ, and an absent attribute read as its dialog's declared default. With no paragraph selected every field is its default. Both dialogs' init read it."
      has_selection:
        type: bool
        description: "One or more objects are selected"
      selection_count:
        type: number
        description: "Number of selected objects"
      can_undo:
        type: bool
        description: "The undo stack is non-empty"
      can_redo:
        type: bool
        description: "The redo stack is non-empty"
      zoom_level:
        type: number
        description: >
          Current zoom factor (1.0 = 100%). Per-document; not
          serialized to disk. Clamped at the producer side to
          [preferences.viewport.min_zoom, preferences.viewport.max_zoom].
      view_offset_x:
        type: number
        description: >
          Pan: screen-space pixel coordinate of the document's (0,0)
          point within the canvas widget. Positive moves the document
          origin rightward in the viewport. Per-document; not
          serialized.
      view_offset_y:
        type: number
        description: >
          Pan: screen-space pixel coordinate of the document's (0,0)
          point within the canvas widget. Positive moves the document
          origin downward. Per-document; not serialized.
      # Layers-panel rollups. These are read-only and arguably belong on
      # a panel.* namespace; they live here because `active_document` was
      # historically the only namespace with computed-property machinery.
      # Candidate for relocation once path-navigation lands (Phase 4).
      layers_panel_selection_count:
        type: number
        description: "Number of items selected in the layers panel"
      layers_panel_selection_is_container:
        type: bool
        description: "True when the sole selected layer item is a container: a group, a layer, or a Transformed wrapper (entered to edit its child)"
      layers_panel_selection_has_group:
        type: bool
        description: "True when at least one selected layer item is a group"
      # Canvas-selection brush rollups (BRUSHES.md § Bottom toolbar), read by
      # brushes.yaml's Remove Brush Stroke and Brush Options for Selection
      # gates. Until W2b-18 those gates read two bare names that no port built,
      # so both buttons were disabled on every selection.
      selection_has_brushed_stroke:
        type: bool
        description: >
          True when at least one canvas-selected element carries a non-empty
          stroke_brush (a brush id). Only the selected elements themselves are
          read: a group is not searched for brushed descendants.
      selection_is_single_brushed_stroke:
        type: bool
        description: >
          True when exactly one element is canvas-selected and it carries a
          non-empty stroke_brush. Brush Options for Selection edits that one
          stroke's per-instance overrides, so a selection that also holds
          other elements does not qualify.
      # Artboards-panel rollups (ARTBOARDS.md § Artboard data model). Built by
      # every port's active-document view since the artboards work landed and
      # read by artboards.yaml's menu, context menu and keyboard rows; declared
      # here only when the panel-menu read census found them undeclared.
      artboards_count:
        type: number
        description: "Number of artboards in the active document"
      artboards_panel_selection_ids:
        type: list
        item_type: string
        description: >
          Ids of the artboards selected in the Artboards panel, in selection
          order. Empty when nothing is selected there.
      element_tree:
        type: object
        nullable: true
        description: "Hierarchical tree of document elements for panel rendering (tree_view source)"
      element_selection:
        type: list
        item_type: string
        description: "List of IDs of elements currently selected on the canvas"
      # Phase 3 rollups consumed by layers-panel YAML actions (new_layer,
      # delete/duplicate_layer_selection, collect_in_new_layer, etc.).
      # Populated by each platform's dispatch wrapper — see
      # panel_menu.dispatch_yaml_action in jas_ocaml, jas, jas_dioxus, and
      # LayersPanel.dispatchYamlAction in JasSwift.
      top_level_layers:
        type: list
        item_type: object
        description: >
          Top-level Layer elements as flat dicts with keys
          {kind, name, common: {visibility, locked}, path}. Used by
          bulk-toggle actions (toggle_all_layers_*) to iterate.
      top_level_layer_paths:
        type: list
        item_type: path
        description: >
          Paths of the top-level Layer elements, one entry per Layer
          in document order. Used as the source for bulk foreach loops.
      next_layer_name:
        type: string
        description: >
          Auto-generated layer name of the form "Layer N" where N is
          the smallest positive integer not already in use by another
          top-level layer.
      new_layer_insert_index:
        type: number
        description: >
          Index at which a newly created layer should be inserted —
          one above the topmost panel-selected layer, or the current
          layer count when nothing is selected.

  workspace:
    description: >
      Properties of the workspace layout system, managed by the layout
      save/load engine.
    defaults:
      has_saved_layout: false
      active_layout_name: ""
      open_documents: []
    properties:
      has_saved_layout:
        type: bool
        description: "A named layout is currently active (was loaded or saved)"
      active_layout_name:
        type: string
        description: "Name of the currently active layout (empty if none)"
      open_documents:
        type: list
        item_type: object
        description: >
          The open documents, in tab order, one entry per document tab:
          {index, name, is_modified}. `index` is the entry's position (0
          first), the value active_tab names when that tab is the front one.
          `name` is the document's filename, or its untitled name
          ("Untitled-N", N from the application's own counter, which is not
          the tab index) when it has never been saved. `is_modified` is
          whether it has unsaved changes. READ-ONLY: each host builds it from the documents it holds,
          so opening, creating and closing a document changes it and no
          effect writes it. The canvas tab bar (layout.yaml, canvas_tab_bar)
          draws one tab per entry with a foreach. Because the list is rebuilt
          from the documents, closing a tab renumbers the tabs after it; a
          tab never carries an index baked in when it was created.

  panel:
    description: >
      Active panel state. Resolves to the state of whichever panel is
      currently focused or is the target of the effect being
      evaluated. Properties map to keys stored in the StateStore's
      panel-scoped buckets; each panel contributes its own subset.
    defaults:
      layers_panel_selection: []
      isolation_stack: []
    properties:
      layers_panel_selection:
        type: list
        item_type: path
        description: >
          Paths of items currently selected in the layers panel tree.
          Driven by panel-local selection state; serialized as __path__
          markers so they round-trip through the expression evaluator.
      isolation_stack:
        type: list
        item_type: path
        description: >
          Stack of paths to isolated containers in the layers panel,
          innermost level last. Pushed by enter_isolation_mode, popped
          by exit_isolation_mode.

# ──────────────────────────────────────────────────────────────────
# Lexically-bound contexts
#
# Unlike runtime_contexts (which are always accessible from any
# expression), these variables are bound only inside specific language
# constructs. They appear as free identifiers in expressions but only
# resolve to values when evaluated in the correct scope.
#
# Also note: `foreach as: <name>` lexically binds <name> to each item
# in the source list inside the loop body. Every foreach item also
# exposes an implicit `_index` property giving its 0-based position.
# These are language features of `foreach`, not declared contexts —
# the binding name is chosen by the YAML author at each foreach site.

lexical_contexts:

  event:
    description: >
      UI event context bound inside event handler attributes
      (onclick, onmousemove, onkeydown, etc.). Properties reflect the
      triggering DOM/UI event. Not available outside event handlers.
    scope: "Inside event handler attribute expressions"
    properties:
      alt:
        type: bool
        description: "Whether the Alt/Option key was pressed"
      key:
        type: string
        description: "Pressed key name (for keyboard events)"
      target_id:
        type: string
        description: "id attribute of the event target element"
      target_class:
        type: string
        description: "class attribute of the event target element"
      client_x:
        type: number
        description: "Cursor X position in client viewport coordinates"
      client_y:
        type: number
        description: "Cursor Y position in client viewport coordinates"
      offset_x:
        type: number
        description: "Cursor X position relative to the event target"
      offset_y:
        type: number
        description: "Cursor Y position relative to the event target"
      edge:
        type: string
        description: "Edge identifier for resize events (left, right, top, bottom)"
      resize_cursor:
        type: string
        description: "CSS cursor style for the active resize edge"

  node:
    description: >
      Tree node context bound per-row during tree_view rendering.
      Properties describe the element at the current row. Used by the
      layers panel tree template.
    scope: "Inside tree_view row templates"
    properties:
      id:
        type: string
        description: "Element identifier (dot-joined path, e.g. '0.2.1')"
      name:
        type: string
        description: "Display name of the element"
      type:
        type: string
        description: "Element type token (line, rect, group, layer, etc.)"
      type_label:
        type: string
        description: "Human-readable type label for display"
      is_container:
        type: bool
        description: "Whether the element is a container (group or layer)"
      locked:
        type: bool
        description: "Whether the element is locked from editing"
      visibility:
        type: enum
        values: [visible, invisible, preview, outline]
        description: "Visibility state of the element"
      element_selected:
        type: bool
        description: "Whether the element is selected on the canvas"
      panel_selected:
        type: bool
        description: "Whether the element is selected in the layers panel"
      ancestor_layer_color:
        type: color
        description: "Color of the nearest ancestor Layer (inherited visual cue)"
      depth:
        type: number
        description: "Nesting depth from the document root (0 = top level)"
      search_ancestor_only:
        type: bool
        description: "True when visible in search results only because a descendant matched"

  prop:
    description: >
      Template instantiation context bound when a parameterized template
      is expanded. Properties come from the instantiation site.
      Currently used for tab-creation templates.
    scope: "Inside template bodies"
    properties:
      index:
        type: number
        description: "Numeric index from the instantiation site (e.g. tab number)"
