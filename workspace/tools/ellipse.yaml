# Ellipse tool.
#
# Press-drag-release drawing: mousedown captures the starting corner of
# the bounding rectangle, mousemove tracks the current corner (drives
# the overlay preview), and mouseup commits a new ellipse fitted into
# that bounding rectangle if the final box is at least 1 pixel in each
# dimension. Zero-size boxes are suppressed so a stray click doesn't
# deposit an invisible shape.
#
# The committed element is `ellipse` with cx, cy at the bounding-box
# center and rx, ry as half the box dimensions.
#
# HOLDING SHIFT CONSTRAINS THE DRAG TO A CIRCLE. The square's side is
# max(|dx|, |dy|) — the shape follows the cursor's furthest reach — and
# it grows into the quadrant being dragged toward, so the mousedown
# point stays put as the anchor. A PURE HORIZONTAL drag (dy = 0) still
# produces a circle: the vertical direction has no sign to follow, so it
# takes the positive branch and the shape extends downward.
#
# The constraint is applied WHERE THE CURSOR STATE IS WRITTEN, not where
# it is read. That keeps the overlay below completely unaware of it —
# `cur_x`/`cur_y` already carry the constrained point, so the dashed
# preview and the committed element cannot disagree about what Shift
# means. Any later constraint (Alt, snapping) belongs at the same seam.
#
# The constrained SIDE is carried in state (`doc_w`/`doc_h`) rather than
# recovered from the constrained point, because re-subtracting the anchor
# is not exact in floating point away from a dyadic zoom. See the state
# block below.
#
# The element type stays `ellipse` even when rx == ry. A circle is an
# ellipse whose radii happen to be equal; emitting a `circle` element
# would mean the TYPE changed when a later edit made them unequal, and
# the preservation law (ELEMENT IDENTITY) says an edit changes what it
# speaks to and preserves the rest. Type is not one of the things a
# radius edit gets to change.
#
# Alt to draw from the center is still unbuilt.
# <!-- expires-when: {"port": "rust",
#                     "file": "workspace/tools/ellipse.yaml",
#                     "lacks": "event.modifiers.alt"} -->
#
# Fill and stroke are intentionally omitted from the add_element spec —
# doc.add_element falls through to model.default_fill and
# model.default_stroke (driven by the app's color panel). Matches
# rect.yaml / line.yaml convention.
#
# Validated against schema/tool.schema.json.

id: ellipse
cursor: crosshair
menu_label: "Ellipse Tool"
shortcut: "L"

state:
  # States: idle | drawing
  mode:
    default: "idle"
    enum: [idle, drawing]
  # Screen-space (viewport-pixel) anchors. The overlay reads these
  # to draw the dashed preview post-restore in screen-space.
  start_x: { default: 0 }
  start_y: { default: 0 }
  cur_x: { default: 0 }
  cur_y: { default: 0 }
  # Document-space anchor captured at mousedown. Used at commit
  # time so the new element lands at the correct location even
  # when the canvas has a non-zero pan / zoom transform.
  doc_start_x: { default: 0 }
  doc_start_y: { default: 0 }
  # Document-space release point, AFTER any Shift constraint. Written at
  # mouseup and read by the commit on the next step, so the committed
  # geometry and the guard below both see the same constrained point.
  # These fix the shape's POSITION (which quadrant it grew into); the
  # SIZE comes from doc_w / doc_h below.
  doc_end_x: { default: 0 }
  doc_end_y: { default: 0 }
  # Document-space SIZE of the shape, written at mouseup beside doc_end_*.
  #
  # THE SIDE IS CARRIED, NEVER RECOVERED. The obvious commit expression is
  # `abs(doc_end_x - doc_start_x) / 2`, which re-derives the radius by
  # subtracting back the anchor that was just added to it. That round trip
  # is not exact in binary floating point: at a zoom whose reciprocal is
  # not a power of two the anchor is a non-dyadic number, `anchor + side`
  # rounds when the sum crosses a binade, and the subtraction returns
  # `side` off by one ulp — on ONE axis. Shift then produced an `ellipse`
  # with rx != ry (a circle only at 100% zoom, which is why the hand smoke
  # test passed). So the side is computed ONCE, here, and read DIRECTLY.
  #
  # Under Shift the two fields carry the SAME expression, so they are
  # bit-identical and rx == ry exactly at every zoom. Unconstrained they
  # are the two independent box dimensions, as before.
  #
  # The dashed overlay still derives its extent from cur_* the same way,
  # deliberately: that round trip carries the same ulp, but in SCREEN
  # space, where it is 1e-14 of a PIXEL — below anything a renderer or an
  # artist can resolve — so the preview is left alone rather than growing
  # a second carried value.
  doc_w: { default: 0 }
  doc_h: { default: 0 }

handlers:

  on_enter:
    - set: { tool.ellipse.mode: "'idle'" }

  on_leave:
    - set: { tool.ellipse.mode: "'idle'" }

  on_mousedown:
    - set: { tool.ellipse.mode: "'drawing'" }
    - set: { tool.ellipse.start_x: "event.x" }
    - set: { tool.ellipse.start_y: "event.y" }
    - set: { tool.ellipse.cur_x: "event.x" }
    - set: { tool.ellipse.cur_y: "event.y" }
    - set: { tool.ellipse.doc_start_x: "event.doc_x" }
    - set: { tool.ellipse.doc_start_y: "event.doc_y" }

  on_mousemove:
    - if: "tool.ellipse.mode == 'drawing'"
      then:
        # THE SHIFT CONSTRAINT LIVES HERE, on the write. Both branches
        # read only `event` and `start_*`, never the sibling being
        # written, so the two sets are order-independent.
        - set:
            tool.ellipse.cur_x: >-
              if event.modifiers.shift
              then tool.ellipse.start_x + (if event.x >= tool.ellipse.start_x
                   then max(abs(event.x - tool.ellipse.start_x), abs(event.y - tool.ellipse.start_y))
                   else 0 - max(abs(event.x - tool.ellipse.start_x), abs(event.y - tool.ellipse.start_y)))
              else event.x
        - set:
            tool.ellipse.cur_y: >-
              if event.modifiers.shift
              then tool.ellipse.start_y + (if event.y >= tool.ellipse.start_y
                   then max(abs(event.x - tool.ellipse.start_x), abs(event.y - tool.ellipse.start_y))
                   else 0 - max(abs(event.x - tool.ellipse.start_x), abs(event.y - tool.ellipse.start_y)))
              else event.y

  on_mouseup:
    - if: "tool.ellipse.mode == 'drawing'"
      then:
        # Re-apply the constraint at the release point, in BOTH spaces:
        # screen for the size guard below, document for the commit. The
        # release can land somewhere no mousemove reported.
        - set:
            tool.ellipse.cur_x: >-
              if event.modifiers.shift
              then tool.ellipse.start_x + (if event.x >= tool.ellipse.start_x
                   then max(abs(event.x - tool.ellipse.start_x), abs(event.y - tool.ellipse.start_y))
                   else 0 - max(abs(event.x - tool.ellipse.start_x), abs(event.y - tool.ellipse.start_y)))
              else event.x
        - set:
            tool.ellipse.cur_y: >-
              if event.modifiers.shift
              then tool.ellipse.start_y + (if event.y >= tool.ellipse.start_y
                   then max(abs(event.x - tool.ellipse.start_x), abs(event.y - tool.ellipse.start_y))
                   else 0 - max(abs(event.x - tool.ellipse.start_x), abs(event.y - tool.ellipse.start_y)))
              else event.y
        - set:
            tool.ellipse.doc_end_x: >-
              if event.modifiers.shift
              then tool.ellipse.doc_start_x + (if event.doc_x >= tool.ellipse.doc_start_x
                   then max(abs(event.doc_x - tool.ellipse.doc_start_x), abs(event.doc_y - tool.ellipse.doc_start_y))
                   else 0 - max(abs(event.doc_x - tool.ellipse.doc_start_x), abs(event.doc_y - tool.ellipse.doc_start_y)))
              else event.doc_x
        - set:
            tool.ellipse.doc_end_y: >-
              if event.modifiers.shift
              then tool.ellipse.doc_start_y + (if event.doc_y >= tool.ellipse.doc_start_y
                   then max(abs(event.doc_x - tool.ellipse.doc_start_x), abs(event.doc_y - tool.ellipse.doc_start_y))
                   else 0 - max(abs(event.doc_x - tool.ellipse.doc_start_x), abs(event.doc_y - tool.ellipse.doc_start_y)))
              else event.doc_y
        # The SIZE, computed once from the raw event and never recovered
        # from doc_end_* (see the state block). Under Shift both are the
        # same expression down to the character, so they evaluate to the
        # same double and the committed rx and ry are exactly equal.
        - set:
            tool.ellipse.doc_w: >-
              if event.modifiers.shift
              then max(abs(event.doc_x - tool.ellipse.doc_start_x), abs(event.doc_y - tool.ellipse.doc_start_y))
              else abs(event.doc_x - tool.ellipse.doc_start_x)
        - set:
            tool.ellipse.doc_h: >-
              if event.modifiers.shift
              then max(abs(event.doc_x - tool.ellipse.doc_start_x), abs(event.doc_y - tool.ellipse.doc_start_y))
              else abs(event.doc_y - tool.ellipse.doc_start_y)
        # Zero-size suppression matches rect.yaml: a plain click
        # (release at the same point as press) should not create a
        # shape. 1-pixel threshold on both dimensions, screen-space.
        #
        # MEASURED AGAINST THE CONSTRAINED POINT, not the raw event. A
        # pure horizontal Shift-drag has a raw dy of 0, so testing the
        # event would reject a 100-pixel circle the artist had watched
        # themselves draw. `cur_*` is already constrained two steps up.
        - if: "abs(tool.ellipse.cur_x - tool.ellipse.start_x) > 1 and abs(tool.ellipse.cur_y - tool.ellipse.start_y) > 1"
          then:
            - "doc.snapshot": {}
            - "doc.add_element":
                element:
                  type: ellipse
                  cx: "(tool.ellipse.doc_start_x + tool.ellipse.doc_end_x) / 2"
                  cy: "(tool.ellipse.doc_start_y + tool.ellipse.doc_end_y) / 2"
                  rx: "tool.ellipse.doc_w / 2"
                  ry: "tool.ellipse.doc_h / 2"
    - set: { tool.ellipse.mode: "'idle'" }

  on_keydown:
    - if: "event.key == 'Escape'"
      then:
        - set: { tool.ellipse.mode: "'idle'" }

# Dashed preview ellipse tracking the current drag. Matches rect.yaml's
# preview style: 1-px black stroke at 50% opacity, 4/4 dash, no fill.
# Renders only while drawing is in progress. Computed cx/cy/rx/ry
# place the ellipse inside the bounding box defined by the start and
# current cursor positions.
overlay:
  if: "tool.ellipse.mode == 'drawing'"
  render:
    type: ellipse
    cx: "(tool.ellipse.start_x + tool.ellipse.cur_x) / 2"
    cy: "(tool.ellipse.start_y + tool.ellipse.cur_y) / 2"
    rx: "abs(tool.ellipse.cur_x - tool.ellipse.start_x) / 2"
    ry: "abs(tool.ellipse.cur_y - tool.ellipse.start_y) / 2"
    style: "stroke: rgba(0,0,0,0.5); stroke-width: 1; stroke-dasharray: 4 4; fill: none;"
