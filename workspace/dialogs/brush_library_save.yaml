brush_library_save:
  summary: "Save Brush Library"
  description: >
    Modal dialog for saving a brush library under a name. It is opened by
    the Brushes panel menu's Save Brush Library (save_brush_library) on the
    panel's selected library, whose slug arrives as param.library. The
    dialog presents a single text input for the library name, which starts
    as the library's own display name (param.name; empty when the library
    has none). Cancel closes the dialog and saves nothing. Save
    (save_brush_library_confirm) saves the library under the entered name:
    in place when the name's slug is the library's own slug, otherwise as
    a new library, which is opened in the panel and selected; either way
    the host is asked to write the library's library.json. Save is
    disabled while the name field is empty.
  modal: true
  params:
    library: { type: string, description: "Slug of the library being saved" }
    name: { type: string, nullable: true, description: "The library's display name, proposed as the name to save under" }
  state:
    name: { type: string, default: "", description: "User-entered library name" }
  init:
    name: "if param.name == null then '' else param.name"
  content:
    type: container
    layout: column
    style: { gap: 12, padding: 16 }
    children:
      - { type: text, content: "Library name:" }
      - id: brush_lib_name_input
        type: text_input
        placeholder: "My Brushes"
        bind:
          value: "dialog.name"
      - type: row
        style: { justify: end, gap: 8 }
        children:
          - { type: button, label: "Cancel", action: dismiss_dialog }
          - type: button
            label: "Save"
            action: save_brush_library_confirm
            variant: primary
            params:
              library: "param.library"
              name: "dialog.name"
            bind:
              disabled: 'dialog.name == ""'
