name: Deploy web demo to GitHub Pages

# Push and dispatch only. Pull requests run the same build and level-2 suite in
# web-l2.yml, which has no deploy job, so no PR carries a skipped Deploy check.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token for the Pages deployment: read the repo, write the
# Pages site, and mint the OIDC token deploy-pages uses to authenticate.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/web-build.yml
    permissions:
      contents: read

  # ADVISORY: deploy does not need this job, so a red never stops a deploy.
  web-l2:
    needs: build
    # A red build leaves this job RED (no bundle to fetch), never skipped.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/web-l2-run.yml
    permissions:
      contents: read

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only one Pages deployment at a time; a newer push supersedes an in-flight run.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
