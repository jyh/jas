name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workspace-json-fresh:
    name: workspace.json up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # jsonschema is what makes workspace_interpreter/validator.py take its
      # REAL JSON Schema branch. This lane runs check_workspace_json.sh, which
      # compiles workspace/ and validates it; without jsonschema installed the
      # validator silently degrades to the hand-rolled _validate_minimal subset
      # (transcripts/VALIDATOR_TRIAGE.md). The other PyYAML-only lanes below
      # compile corpora, not the workspace, and never reach the validator.
      - run: pip install PyYAML jsonschema
      - run: bash scripts/check_workspace_json.sh
      - run: python scripts/check_menu_structure.py
      - run: python scripts/check_toolbar_structure.py
      - run: python scripts/check_action_refs.py
      - run: bash scripts/check_panel_goldens.sh
      - run: python scripts/check_path_b_exclusions.py
      - run: bash scripts/check_intent_map.sh
      - run: python scripts/check_preservation_corpus.py
      - run: python scripts/check_corpus_manifest.py --self-test && python scripts/check_corpus_manifest.py
      - run: python scripts/check_swift_copy_sites.py --self-test && python scripts/check_swift_copy_sites.py
      # Asserts every check_*.py runs on BOTH platform families. The list of
      # steps in each lane is hand-maintained, so a gate added after a lane was
      # written is watched on one platform and unwatched on the other, silently.
      # That is how the line above was wrong on Windows for its whole life.
      - run: python scripts/check_lane_coverage.py --self-test && python scripts/check_lane_coverage.py
      # Every function that dispatches on Element kind must account for
      # containers, or carry a ledger row saying why not. Five defects wore
      # that shape in one week, all invisible in Rust and live in JasSwift.
      - run: python scripts/check_element_dispatch.py --self-test && python scripts/check_element_dispatch.py
      # §16.4 asserted over the corpus: no selection holds an element AND its
      # own descendant. Four producers had to be closed before this could pass
      # at all, and it reds on the pre-§20 tree with 13 violations.
      - run: python scripts/check_selection_invariant.py --self-test && python scripts/check_selection_invariant.py

  expr-corpus-fresh:
    name: expression corpus JSON up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: bash scripts/check_expr_corpus.sh

  concept-corpus-fresh:
    name: concept corpus JSON up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: bash scripts/check_concept_corpus.sh

  concept-operations-corpus-fresh:
    name: concept-operation corpus JSON up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: bash scripts/check_concept_operations_corpus.sh

  concept-fitters-corpus-fresh:
    name: concept-fitter corpus JSON up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: bash scripts/check_concept_fitters_corpus.sh

  concept-constraints-corpus-fresh:
    name: concept-constraint corpus JSON up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: bash scripts/check_concept_constraints_corpus.sh

  genericity:
    name: Genericity policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test the lint script
        run: python scripts/genericity_check_test.py
      - name: Run the lint
        run: python scripts/genericity_check.py
      # POLICY.md section 5 — the naming rule. It went silently broken on
      # public main until a chance pre-push grep found 18 occurrences; this
      # is what stops the next one. Self-test first: the gate is trusted
      # for its red, and a check that can only pass is not a check.
      - name: Self-test the naming-rule gate
        run: python scripts/check_naming_rule.py --self-test
      - name: Naming rule (product-agnostic framing)
        run: python scripts/check_naming_rule.py
      # The Windows bring-up (2026-07-28) found 91 sites reading text with no
      # encoding= and 37 writing with no newline=. macOS and Linux default to
      # UTF-8 and LF, so the whole class is invisible here by construction; on
      # Windows the locale codec is cp1252 and text writes emit CRLF. This gate
      # runs on EVERY platform because it is a source-level property — it needs
      # no Windows to be true, only to have been noticed there. Self-test first,
      # same as the naming rule above: trusted for its RED.
      - name: Self-test the encoding-hygiene gate
        run: python scripts/check_encoding_hygiene.py --self-test
      - name: Encoding hygiene (explicit encoding= on text I/O, newline= on writes)
        run: python scripts/check_encoding_hygiene.py

  # THE WINDOWS LANE. Added 2026-07-28, the day this project's gates ran on
  # Windows for the first time: 11 of 24 invocations failed and NOT ONE failure
  # was a real defect in repo content. Every cause was a platform assumption in
  # shared tooling, invisible by construction on macOS and Linux because both
  # default to UTF-8 and LF — a bare open() taking the cp1252 locale codec, a
  # text write emitting CRLF into a byte-compared golden, and a "/"-anchored
  # regex matched against str(Path). The source-level gate above stops the first
  # two classes regrowing; this lane is what notices everything neither of us
  # thought to write a gate for.
  #
  # BLOCKING on purpose (no continue-on-error). A Windows lane that cannot fail
  # the build would report "Windows is covered" while rotting, and a claim wider
  # than its evidence is this project's most serious defect. The lane was green
  # 24/24 on kenai before it was written, so it starts from a known state.
  #
  # DO NOT set PYTHONUTF8, PYTHONIOENCODING or PYTHONLEGACYWINDOWSSTDIO here.
  # PYTHONUTF8=1 repairs the encoding half without editing a single file — that
  # made it the instrument that PROVED the two defects independent, and it would
  # make this lane pass straight over the class it exists to catch.
  windows:
    name: Windows gates (the platform that can see encoding + newline)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      # From requirements.txt, so this lane's deps cannot drift from what the
      # code actually imports — same reasoning as the workspace-interpreter job.
      - run: pip install -r requirements.txt

      # ---- the lane's two premises, asserted rather than assumed ----------
      # Premise 1: Python's default text encoding here is NOT UTF-8. The
      # encoding half of this lane tests nothing if it is. Printed rather than
      # enforced because PEP 686 makes UTF-8 the default in a future Python:
      # when this line reads utf-8, this lane has gone vacuous on that half and
      # wants revisiting — better a visible line in the log than a silent pass.
      - name: Preflight — record the runner's default text encoding
        run: |
          python -c "import locale, sys; print('preferred encoding:', locale.getpreferredencoding(False)); print('stdout encoding :', sys.stdout.encoding)"
      # Premise 2: the checkout is LF despite core.autocrlf being true on the
      # Windows runner image. .gitattributes ("* text=auto eol=lf", under the
      # comment "LF is law in this repository") is what makes that hold. If it
      # ever stops holding, the corpus-freshness gates below would be measuring
      # git's behaviour rather than ours, and would fail confusingly.
      - name: Preflight — the checkout must be LF
        run: |
          if git ls-files --eol | grep -q 'w/crlf'; then
            echo "CRLF in the working tree — .gitattributes did not hold:" >&2
            git ls-files --eol | grep 'w/crlf' | head -20 >&2
            exit 1
          fi
          echo "working tree is LF"

      - name: Encoding hygiene — self-test, then the lint
        run: |
          python scripts/check_encoding_hygiene.py --self-test
          python scripts/check_encoding_hygiene.py

      - name: Structural gates
        run: |
          bash scripts/check_workspace_json.sh
          python scripts/check_menu_structure.py
          python scripts/check_toolbar_structure.py
          python scripts/check_action_refs.py
          bash scripts/check_panel_goldens.sh
          python scripts/check_path_b_exclusions.py
          bash scripts/check_intent_map.sh
          python scripts/check_preservation_corpus.py
          python scripts/check_corpus_manifest.py --self-test
          python scripts/check_corpus_manifest.py
          # Added here after this gate landed 2026-07-28 keyed on str(Path) and
          # failed WHOLESALE on Windows while CI stayed green — it runs in the
          # ubuntu job, and ubuntu is the platform that cannot see the defect.
          # A path-keyed gate belongs on the platform whose paths differ.
          python scripts/check_swift_copy_sites.py --self-test
          python scripts/check_swift_copy_sites.py
          # Same argument as the two lines above, one level up: this asserts no
          # gate is watched on only one platform family. It reports its own
          # absence, so it must appear in both lanes or it fails immediately.
          python scripts/check_lane_coverage.py --self-test
          python scripts/check_lane_coverage.py
          python scripts/check_element_dispatch.py --self-test
          python scripts/check_element_dispatch.py
          python scripts/check_selection_invariant.py --self-test
          python scripts/check_selection_invariant.py
          # Scans git-tracked text via `git ls-files`, which emits POSIX paths on
          # every platform, and compares with PurePosixPath — no str(Path) in the
          # path, so it should be separator-clean here. Windows CI is what proves
          # that, not this comment.
          python scripts/check_naming_rule.py --self-test
          python scripts/check_naming_rule.py

      # These five are the newline half's blast radius: each regenerates a
      # corpus and byte-compares it against the committed golden, so a text
      # write without newline="" turns all five red on data that is current.
      - name: Corpus freshness
        run: |
          bash scripts/check_expr_corpus.sh
          bash scripts/check_concept_corpus.sh
          bash scripts/check_concept_operations_corpus.sh
          bash scripts/check_concept_fitters_corpus.sh
          bash scripts/check_concept_constraints_corpus.sh

      # The separator half: genericity's exclude patterns are "/"-anchored, and
      # matching them against str(Path) silently no-opped every exclusion here.
      - name: Genericity
        run: |
          python scripts/genericity_check_test.py
          python scripts/genericity_check.py

      - name: Reference interpreter conformance
        run: python -m pytest workspace_interpreter/tests -q

      - name: Rust tests
        run: cd jas_dioxus && cargo test

      # SINGLE-LANE ORACLE, deliberately without --require-comparisons: there is
      # no Swift toolchain on Windows, so no lane-vs-lane comparison is possible
      # here. The cross-language job below documents this as the legitimate mode
      # for a box with one lane — it checks the PINNED GOLDENS rather than mutual
      # agreement, which is exactly the property a third platform should confirm.
      # The blocking two-lane equivalence gate remains the macOS job; this does
      # not replace it and must not be read as doing so.
      - name: Cross-language — rust oracle against the pinned goldens
        run: |
          python scripts/lane_report.py --self-test
          python scripts/cross_language_algorithms.py --lang rust
          python scripts/cross_language_commutativity.py --lang rust
          python scripts/cross_language_workspace.py --lang rust

  rust:
    name: Rust tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd jas_dioxus && cargo test

  # The shared reference interpreter lives in workspace_interpreter/ — the
  # exact modules (effects, state_store, scope, doc_primitives, loader, expr)
  # every native app mirrors. It stays LIVE and BLOCKING under the
  # five-port-parity freeze (POLICY.md): it is the spec's executable meaning
  # and the corpus-authoring substrate.
  workspace-interpreter:
    name: Reference interpreter conformance (Python reference)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install from requirements.txt so the CI deps cannot drift from what
      # the code actually imports.
      - run: pip install -r requirements.txt
      - run: python -m pytest workspace_interpreter/tests

  # The jas/ Qt app is FROZEN at the five-port-parity tag (POLICY.md): this
  # lane checks out the WHOLE repo at the tag — not just fixtures — because
  # the app imports live workspace_interpreter modules, so a HEAD checkout
  # would mix frozen app code with an evolving interpreter. Tag-pinned, the
  # job can only red on toolchain drift, which is exactly the canary signal;
  # continue-on-error keeps frozen-lane noise from blocking active work
  # (same pattern as the flask job).
  python-canary:
    name: Python Qt app (frozen toolchain canary)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: five-port-parity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Preflight — pinned inputs present
        run: test -f workspace/workspace.json && test -d test_fixtures/algorithms
      - run: cd jas && python -m pytest

  # jas_ocaml is FROZEN at the five-port-parity tag (POLICY.md): whole-repo
  # tag checkout pins its sources, test_fixtures/, and workspace/workspace.json
  # together. The preflight guards against a botched pin: several OCaml suites
  # Alcotest.skip (or pass vacuously) when the bundle is missing, so a bad
  # checkout would otherwise go green instead of red.
  ocaml-canary:
    name: OCaml (frozen toolchain canary)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: five-port-parity
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      # alcotest is the test framework the jas_ocaml test/ dune files depend on
      # (libraries jas lablgtk3 alcotest).
      - run: opam install --yes dune lablgtk3 xmlm yojson alcotest msgpck camlzip
      - name: Preflight — pinned inputs present
        run: test -f workspace/workspace.json && test -d test_fixtures/algorithms
      - run: cd jas_ocaml && opam exec -- dune test

  swift:
    name: Swift tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Pin a recent Xcode: Tests/Document/WriteChokepointTests uses swift-testing
      # exit tests (`#expect(processExitsWith:)`), which need Swift 6.2+ (Xcode
      # 26+). The runner default was older, so the whole suite failed to compile.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: cd JasSwift && swift test

  # Flask is a non-gating reference renderer (TESTING_STRATEGY.md §6), so this
  # job does not block the merge (continue-on-error) — but it keeps the flask
  # reference renderer and its parked workspace-spec tests (Path B layout,
  # opacity/artboards/concepts panels) from rotting silently, as they had:
  # a stale test_all_menu_actions_exist was red here for lack of any CI.
  flask:
    name: Flask reference tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r jas_flask/requirements.txt
      - run: cd jas_flask && python -m pytest tests/

  # Blocking equivalence lane for the ACTIVE ports (Rust, Swift) per the
  # five-port-parity freeze (POLICY.md). The frozen ports' equivalence is
  # preserved at the tag their canary lanes check out; every driver cell here
  # is anchored to pinned goldens, not mutual agreement.
  cross-language:
    name: Cross-language equivalence (active ports)
    needs: [rust, swift]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pre-build exactly the binaries the equivalence drivers invoke, so the
      # first driver call does not compile inside its per-command timeout
      # (finding #25). The drivers run `swift run AlgorithmRoundtrip` (DEBUG)
      # and `cargo run --bin ...` — so the Swift build must be DEBUG (the old
      # `swift build -c release` left the debug binary to compile on-demand,
      # timing out `measure swift` after 60s).
      - name: Build all
        run: |
          (cd jas_dioxus && cargo build --bins)
          (cd JasSwift && swift build)
      # Self-test the summary's own reporting rules before trusting a summary
      # (scripts/lane_report.py). A cloud referee's single-lane replay on
      # 2026-07-27 showed the old line — "410 passed ... x 0 comparisons" —
      # reading like a cross-language pass when zero comparisons had run.
      - name: Self-test the lane-report rules
        run: python scripts/lane_report.py --self-test
      # --require-comparisons: this lane is the BLOCKING cross-language gate,
      # so a run that performed no lane-vs-lane comparison (a lane dropped, a
      # --lang edited down to one) must exit non-zero here rather than pass as
      # an oracle run. Single-lane oracle runs stay legitimate WITHOUT the flag
      # — that is how a Linux box with no Swift checks the pinned goldens.
      - name: Algorithm equivalence
        run: python scripts/cross_language_algorithms.py --lang rust,swift --require-comparisons
      - name: SVG commutativity
        run: python scripts/cross_language_commutativity.py --lang rust,swift --require-comparisons
      - name: Workspace equivalence
        run: python scripts/cross_language_workspace.py --lang rust,swift --require-comparisons
