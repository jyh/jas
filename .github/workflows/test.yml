name: Tests

on:
  push:
    branches: [main]
  # ⛔ NO `branches:` FILTER ON pull_request, AND THAT IS THE FIX. For
  # `pull_request`, `branches:` filters on the BASE branch — so a PR STACKED ON
  # ANOTHER BRANCH never matched `[main]` and this entire workflow silently did
  # not run. Its checks still showed GREEN, because the Scrub workflow (which has
  # no such filter) ran its hook gates and nothing said the suite was absent.
  #
  # Measured by flask 2026-08-28 on PRs #20 and #44: 4/4 checks green, all four
  # of them hook gates, ZERO test jobs. ⇒ A STACKED PR WAS INDISTINGUISHABLE FROM
  # A TESTED ONE, and this repo uses stacked PRs routinely — #32 and #34 were
  # both stacked, and both read as fully green.
  #
  # ⚠️ The `push` filter STAYS. Removing it would run the whole matrix on every
  # push to every branch; PRs are where the review decision is made, and that is
  # the gap that mattered.
  pull_request:

jobs:
  # SCRUBGUARD MOVED, 2026-08-20, and the move is the repair.
  #
  # The trailer gate used to be a job here. This workflow triggers on
  # `branches: [main]`, so a branch pushed to origin without a pull request
  # targeting main never ran it -- and two such branches reached the public
  # remote carrying session URLs. The gate was sound the whole time; nothing
  # invoked it where it was needed.
  #
  # It now lives in `scrub.yml`, whose `on: push` carries no branch filter.
  # Widening THIS file's trigger instead would have run ~16 jobs including the
  # Windows lane on every scratch-branch push -- a price that invites the next
  # reader to narrow it again. `scripts/check_scrub_trigger.py` asserts the
  # reachability property mechanically so it cannot narrow silently.
  #
  # The Windows lane still runs the trailer gate (see the `windows` job): every
  # commit that ever carried the forbidden trailer was authored on that
  # platform, and check_lane_coverage.py requires both platform families.

  workspace-json-fresh:
    name: workspace.json up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # jsonschema is what makes workspace_interpreter/validator.py take its
      # REAL JSON Schema branch. This lane runs check_workspace_json.sh, which
      # compiles workspace/ and validates it; without jsonschema installed the
      # validator silently degrades to the hand-rolled _validate_minimal subset
      # (transcripts/VALIDATOR_TRIAGE.md). The other PyYAML-only lanes below
      # compile corpora, not the workspace, and never reach the validator.
      - run: pip install PyYAML jsonschema
      - run: bash scripts/check_workspace_json.sh
      - run: python scripts/check_menu_structure.py
      - run: python scripts/check_toolbar_structure.py
      - run: python scripts/check_action_refs.py
      - run: bash scripts/check_panel_goldens.sh
      - run: python scripts/check_path_b_exclusions.py
      - run: bash scripts/check_intent_map.sh
      - run: python scripts/check_preservation_corpus.py
      - run: python scripts/check_corpus_manifest.py --self-test && python scripts/check_corpus_manifest.py
      - run: python scripts/check_swift_copy_sites.py --self-test && python scripts/check_swift_copy_sites.py
      # Asserts every check_*.py runs on BOTH platform families. The list of
      # steps in each lane is hand-maintained, so a gate added after a lane was
      # written is watched on one platform and unwatched on the other, silently.
      # That is how the line above was wrong on Windows for its whole life.
      - run: python scripts/check_lane_coverage.py --self-test && python scripts/check_lane_coverage.py
      # The STEP-level sibling of the gate above: check_lane_coverage asserts
      # every gate is watched on both platform families, and this asserts that
      # being in a lane's list is enough to actually RUN -- a gate sitting below
      # a step that aborts is watched on paper only.
      #
      # It lives HERE and not in `genericity` for a reason CI had to teach: it
      # imports yaml, and the genericity job installs NO dependencies (every gate
      # there is stdlib-only). This job pip-installs PyYAML, and it is where the
      # yaml-importing sibling above already runs.
      - run: python scripts/check_step_cannot_hide.py --self-test && python scripts/check_step_cannot_hide.py
      # A gate that ASSERTS must never be skipped into silence by a red
      # dependency. `cross-language` -- the prime-directive gate -- was
      # skipped on 5095060d because an unrelated cargo fault reddened the
      # rust job, and a skipped job reads as 'not applicable'.
      - run: python scripts/check_gate_cannot_skip.py --self-test && python scripts/check_gate_cannot_skip.py
      # TOTALITY over the checker tier: every family classified, every floor
      # declared in its fixture, every mutant carrying a named prior bug, and
      # spec/ importing nothing from this repository. A checker lane that
      # silently inspects nothing is indistinguishable from a clean tree.
      - run: python scripts/check_geometry_checkers.py --self-test && python scripts/check_geometry_checkers.py
      # Every function that dispatches on Element kind must account for
      # containers, or carry a ledger row saying why not. Five defects wore
      # that shape in one week, all invisible in Rust and live in JasSwift.
      - run: python scripts/check_element_dispatch.py --self-test && python scripts/check_element_dispatch.py
      # Every resolver-less bounds call in production carries a written
      # verdict. `bounds()` answers a zero box AT THE ORIGIN for the live
      # kinds, and five fixes in a week wore that shape; a new blind reader
      # must be declared rather than discovered by an artist.
      - run: python scripts/check_bounds_resolver_ledger.py --self-test && python scripts/check_bounds_resolver_ledger.py
      # §16.4 asserted over the corpus: no selection holds an element AND its
      # own descendant. Four producers had to be closed before this could pass
      # at all, and it reds on the pre-§20 tree with 13 violations.
      - run: python scripts/check_selection_invariant.py --self-test && python scripts/check_selection_invariant.py
      # Every ACTIVE PORT must dispatch every canonical widget kind, or carry an
      # exemption row with a reason. JasSwift was missing three, all declared in
      # the shipping workspace; the Layers element-type filter shipped as the
      # placeholder TEXT "Filter by element type". Port six's table starts empty.
      - run: python scripts/check_widget_kind_dispatch.py --self-test && python scripts/check_widget_kind_dispatch.py
      # One vocabulary for the Layers type filter, spoken identically by the
      # YAML and both active ports, and derived from the ELEMENT. jas_dioxus
      # parsed the row LABEL, so naming an element exempted it from the filter
      # -- correct the day it was written, broken by the later commit that let
      # every element carry a name. Reds on that historical block.
      - run: python scripts/check_layers_type_filter.py --self-test && python scripts/check_layers_type_filter.py
      # Every log-only action must say which port implements it natively, and the
      # two must AGREE. Found 8 one-port divergences on its first run, including
      # File>Save As doing nothing in jas_dioxus. Its self-test anchors are
      # hand-verified against the live tree because the predicted failure mode is
      # misreading two hand-written switches -- which it did, three times, before
      # the anchors were satisfied.
      - run: python scripts/check_action_implementations.py --self-test && python scripts/check_action_implementations.py
      # No shared-Python gate may KEY on a stringified path: str(Path) yields
      # backslashes on Windows, and three gates were broken that way, each fixed
      # as an instance with an explanatory comment and no rule. Verified by hand
      # against all three historical sightings before wiring -- three of three.
      - run: python scripts/check_path_keying.py --self-test && python scripts/check_path_keying.py
      # Every `set_document` caller sits inside a transaction. The runtime
      # debug_assert for this landed 2026-06-19 without sweeping existing
      # callers, and one stray call panicked every debug build's Layers panel
      # for six weeks -- poisoning the RefCell so every later event failed too.
      # A runtime assertion only fires if someone runs the debug build and
      # reaches the line; this is the same claim on every build.
      - run: python scripts/check_set_document_bracketing.py --self-test && python scripts/check_set_document_bracketing.py
      # A deferral that states its own precondition gets that precondition
      # checked. The narrow survivor of the premise-expiry proposal, which was
      # scored 1-of-5 and 0-of-3 by two independent parties and ruled dead in
      # general: a deferral is the ONE population where someone knew the premise
      # was a premise and wrote it down. Per-port claims, because a cross-port
      # premise checked by a single grep answers for the wrong port.
      - run: python scripts/check_deferral_expiry.py --self-test && python scripts/check_deferral_expiry.py
      # INDEXBLIND: reds while untracked files exist, because eight gates
      # derive their subject list from `git ls-files` and cannot see one. Always
      # green in CI (a checkout has no untracked files) -- its value is the
      # LOCAL sweep, which is where a red gate once shipped inside a commit
      # claiming every gate was green.
      - run: python scripts/check_index_blindspot.py --self-test && python scripts/check_index_blindspot.py
      # SPECMUTANTS: which clauses of the analytic law the corpus actually
      # exercises. docs/CHECKERS.md named this instrument and left its coverage
      # question open; this answers it for the membership half and says so.
      - run: python scripts/check_spec_mutation_coverage.py --self-test && python scripts/check_spec_mutation_coverage.py
      - run: python scripts/check_gate_consistency.py --self-test && python scripts/check_gate_consistency.py
      # One sanctioned grouping for every degree/radian conversion, in both
      # active ports. `(deg * PI) / 180` and `deg * (PI / 180)` are different
      # doubles -- they disagree in BITS on 384 of 1441 integer degrees -- and
      # since MATRIXPRECISION the saved SVG carries a/b/c/d at full precision,
      # so the divergence reaches the file. No corpus tolerance can see it: the
      # tightest in the registry is 1e-12 and the difference is 1e-16. Swept 42
      # sites on 2026-08-01; this is what stops the 43rd.
      - run: python scripts/check_degree_radian_grouping.py --self-test && python scripts/check_degree_radian_grouping.py
      # Per-family non-default variance. A census on 2026-08-02 found seven
      # corpus-wide frozen dimensions whose constants are EXACTLY the struct
      # defaults -- a corpus of defaults cannot tell a dropped field from a
      # preserved one, which is check_swift_copy_sites.py's class from the other
      # end. Per-family on purpose: pooled counting is what hides it (opacity
      # takes 9 distinct values corpus-wide while actions/ sits at 334 of 334).
      - run: python scripts/check_default_variance.py --self-test && python scripts/check_default_variance.py

  expr-corpus-fresh:
    name: expression corpus JSON up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: bash scripts/check_expr_corpus.sh

  concept-corpus-fresh:
    name: concept corpus JSON up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: bash scripts/check_concept_corpus.sh

  concept-operations-corpus-fresh:
    name: concept-operation corpus JSON up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: bash scripts/check_concept_operations_corpus.sh

  concept-fitters-corpus-fresh:
    name: concept-fitter corpus JSON up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: bash scripts/check_concept_fitters_corpus.sh

  concept-constraints-corpus-fresh:
    name: concept-constraint corpus JSON up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: bash scripts/check_concept_constraints_corpus.sh

  wasm-canvas:
    name: Canvas path (wasm — the half no suite could run)
    runs-on: ubuntu-latest
    # ⛔ NO `needs:`. This lane reports its own verdict or it reports nothing —
    # the property check_gate_cannot_skip.py exists to protect.
    #
    # WHY IT EXISTS: until 2026-08-28 this repo had NO wasm harness at all, so
    # every claim about the canvas renderer was compile-verified only. Defect
    # D-β (the mask scratch singleton, PR #45) lived precisely there and had to
    # be found by reading. Its first test is that defect.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # ⛔ INSTALLED BY cargo, NOT BY A THIRD-PARTY ACTION. The first cut used
      # `jetli/wasm-pack-action@v0.4` and the lane died in 3s with "unable to
      # resolve action ... unable to find version v0.4" -- never reaching a test.
      # A pinned marketplace tag is a dependency that rots outside this repo;
      # `cargo install --locked` is slower and resolves from the same lockfile
      # discipline everything else here uses.
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      # Chrome is preinstalled on ubuntu-latest images; headless needs no display.
      #
      # ⛔ ONE RUN, AND THE COUNT IS READ BACK FROM IT. `wasm-pack test` exits 0
      # having run ZERO tests -- a cfg that stops matching, a renamed module, and
      # the lane stays green having executed nothing. The first cut ran the suite
      # TWICE to check that, which doubled the lane and let the two runs disagree;
      # `tee` under `pipefail` keeps the real exit status of the single run.
      - name: Canvas-path tests in a real browser, and the count read back
        shell: bash
        run: |
          set -o pipefail
          wasm-pack test --headless --chrome jas_dioxus 2>&1 | tee /tmp/wasm.log
          n=$(grep -oE '[0-9]+ passed' /tmp/wasm.log | head -1 | grep -oE '[0-9]+' || true)
          if [ -z "$n" ] || [ "$n" -lt 4 ]; then
            echo "FAIL: expected at least 4 canvas tests to RUN, saw '${n:-none}'." >&2
            echo "      A green lane that executed nothing is the shape this lane exists to end." >&2
            exit 1
          fi
          echo "canvas lane ran $n test(s)"

  genericity:
    name: Genericity policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test the lint script
        run: python scripts/genericity_check_test.py
      - name: Run the lint
        run: python scripts/genericity_check.py
      # POLICY.md section 5 — the naming rule. It went silently broken on
      # public main until a chance pre-push grep found 18 occurrences; this
      # is what stops the next one. Self-test first: the gate is trusted
      # for its red, and a check that can only pass is not a check.
      - name: Self-test the naming-rule gate
        run: python scripts/check_naming_rule.py --self-test
      - name: Naming rule (product-agnostic framing)
        run: python scripts/check_naming_rule.py
      # The Windows bring-up (2026-07-28) found 91 sites reading text with no
      # encoding= and 37 writing with no newline=. macOS and Linux default to
      # UTF-8 and LF, so the whole class is invisible here by construction; on
      # Windows the locale codec is cp1252 and text writes emit CRLF. This gate
      # runs on EVERY platform because it is a source-level property — it needs
      # no Windows to be true, only to have been noticed there. Self-test first,
      # same as the naming rule above: trusted for its RED.
      - name: Self-test the encoding-hygiene gate
        run: python scripts/check_encoding_hygiene.py --self-test
      - name: Encoding hygiene (explicit encoding= on text I/O, newline= on writes)
        run: python scripts/check_encoding_hygiene.py
      # A virtualenv in PUBLIC history cannot be removed without a history purge,
      # and this repo came within one `git add -A` of that on 08/26: .gitignore
      # said `.venv`, which matched one directory, while `.venv.old` sat beside
      # it unignored at 1.2 GB / 7,215 files. The ignore rule was widened to the
      # class the same hour — and a widened rule is REMEMBERING. This catches the
      # OUTCOME, which is the only half CI can see: a developer's untracked debris
      # never exists in CI's checkout, but the index does. Self-test first, same
      # as the two gates above: trusted for its RED.
      - name: Self-test the vendored-env gate
        run: python scripts/check_no_vendored_env.py --self-test
      - name: No virtualenv is tracked in this public repo
        run: python scripts/check_no_vendored_env.py
      # A test without #[test] has never run. Found 2026-08-27 by mutating a
      # lowering table and watching NOTHING go red: canvas/render.rs carried a
      # mask-plan test with no attribute, so the STANDARD opacity mask had no
      # coverage. rustc warned the whole time, inside 52 warnings — which is why
      # this exists as a gate and not as a habit of reading build output.
      - name: Self-test the unregistered-test gate
        run: python scripts/check_unregistered_tests.py --self-test
      - name: Every test function carries #[test]
        run: python scripts/check_unregistered_tests.py

  # THE WINDOWS LANE. Added 2026-07-28, the day this project's gates ran on
  # Windows for the first time: 11 of 24 invocations failed and NOT ONE failure
  # was a real defect in repo content. Every cause was a platform assumption in
  # shared tooling, invisible by construction on macOS and Linux because both
  # default to UTF-8 and LF — a bare open() taking the cp1252 locale codec, a
  # text write emitting CRLF into a byte-compared golden, and a "/"-anchored
  # regex matched against str(Path). The source-level gate above stops the first
  # two classes regrowing; this lane is what notices everything neither of us
  # thought to write a gate for.
  #
  # BLOCKING on purpose (no continue-on-error). A Windows lane that cannot fail
  # the build would report "Windows is covered" while rotting, and a claim wider
  # than its evidence is this project's most serious defect. The lane was green
  # 24/24 on kenai before it was written, so it starts from a known state.
  #
  # DO NOT set PYTHONUTF8, PYTHONIOENCODING or PYTHONLEGACYWINDOWSSTDIO here.
  # PYTHONUTF8=1 repairs the encoding half without editing a single file — that
  # made it the instrument that PROVED the two defects independent, and it would
  # make this lane pass straight over the class it exists to catch.
  #
  # FULL SURFACE: every judging step below carries `if: ${{ !cancelled() }}`, so
  # this lane reports its WHOLE surface in one run. It did not always. GitHub
  # gives every step an implicit `if: success()`, which makes a step list a
  # CHAIN — the first red aborts the rest and they report `skipped`, and a run
  # page renders that as *not applicable* rather than *not checked*. That is the
  # same misreading `check_gate_cannot_skip.py` exists to prevent between JOBS;
  # this is the same defect one level down, inside a job that ran.
  #
  # It cost real coverage. Across f40ecff1..6721cd09 — 61 first-parent commits —
  # an early red meant the Rust steps at the bottom of this list never executed.
  # PIN THE UNIT: 61 counts commits during which those steps were DARK, not
  # commits that changed Rust; `jas_dioxus/` moved in 28 of the 61. Both numbers
  # are real and they answer different questions.
  #
  # WHY STEP-LEVEL `if:` AND NOT SEVERAL JOBS. Splitting into a `needs:` chain
  # would buy the same isolation and pay for it twice: a fresh checkout,
  # setup-python, Rust toolchain and pip install per job — on the slowest runner
  # image we use — plus a cold cargo `target/` for the Rust half, which is the
  # part we most want to keep warm. It would also put every new job under
  # `check_gate_cannot_skip.py`, so each would need this very condition anyway.
  # Same isolation, several minutes dearer, more moving parts.
  #
  # NOT `continue-on-error`. That is the trade run backwards: the step runs and
  # the lane goes GREEN over a real failure. This lane is BLOCKING on purpose
  # (see above), and coverage bought by discarding the verdict is exactly the
  # "claim wider than its evidence" this file already refuses. `check_step_
  # cannot_hide.py` fails on it.
  #
  # WHAT THIS COSTS, stated rather than discovered later: if `pip install` fails,
  # the Python gates below now RUN and fail on the missing module instead of
  # skipping — a dozen reds whose real cause is the one red above them. That is
  # accepted deliberately. It is strictly more information than the old
  # behaviour (one red and thirteen silent skips), the cause is named at the top
  # of the same page, and the steps that need no Python at all — `Rust tests`
  # above all — now survive a pip failure instead of vanishing with it. The
  # alternative, coupling eleven steps to a pip `id`, rebuilds the chain this
  # change exists to break.
  #
  # SETUP STEPS STAY FAIL-FAST, and are not an omission. checkout, setup-python,
  # the toolchain and pip install judge nothing; running the Rust tests after a
  # failed checkout produces noise, not coverage. The gate derives that
  # distinction from each step's own content rather than a hand list.
  windows:
    name: Windows gates (the platform that can see encoding + newline)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # fetch-depth: 0 for check_commit_trailers.py below — it guards HISTORY,
      # and on a depth-1 checkout it would scan one commit. It refuses to run
      # shallow rather than trusting this line to stay here, so deleting this
      # reds the lane instead of quietly hollowing the gate.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      # From requirements.txt, so this lane's deps cannot drift from what the
      # code actually imports — same reasoning as the workspace-interpreter job.
      - run: pip install -r requirements.txt

      # ---- the lane's two premises, asserted rather than assumed ----------
      # Premise 1: Python's default text encoding here is NOT UTF-8. The
      # encoding half of this lane tests nothing if it is. Printed rather than
      # enforced because PEP 686 makes UTF-8 the default in a future Python:
      # when this line reads utf-8, this lane has gone vacuous on that half and
      # wants revisiting — better a visible line in the log than a silent pass.
      - name: Preflight — record the runner's default text encoding
        run: |
          python -c "import locale, sys; print('preferred encoding:', locale.getpreferredencoding(False)); print('stdout encoding :', sys.stdout.encoding)"
      # Premise 2: the checkout is LF despite core.autocrlf being true on the
      # Windows runner image. .gitattributes ("* text=auto eol=lf", under the
      # comment "LF is law in this repository") is what makes that hold. If it
      # ever stops holding, the corpus-freshness gates below would be measuring
      # git's behaviour rather than ours, and would fail confusingly.
      - name: Preflight — the checkout must be LF
        id: lf
        run: |
          if git ls-files --eol | grep -q 'w/crlf'; then
            echo "CRLF in the working tree — .gitattributes did not hold:" >&2
            git ls-files --eol | grep 'w/crlf' | head -20 >&2
            exit 1
          fi
          echo "working tree is LF"

      - name: Encoding hygiene — self-test, then the lint
        if: ${{ !cancelled() }}
        run: |
          python scripts/check_encoding_hygiene.py --self-test
          python scripts/check_encoding_hygiene.py

      # ⛔ ON THIS LANE BECAUSE ITS MARKERS ARE PATH-SHAPED, not because a rule
      # says every gate runs everywhere. `(^|/)(bin|Scripts)/activate…` and
      # `site-packages/` are separator-sensitive patterns, and `Scripts/` is the
      # Windows venv layout specifically — so this is the platform whose venvs it
      # most needs to recognise. The oracle is `git ls-files`, which emits
      # forward slashes on every platform; running here proves that rather than
      # assuming it.
      - name: No virtualenv is tracked — self-test, then the gate
        if: ${{ !cancelled() }}
        run: |
          python scripts/check_no_vendored_env.py --self-test
          python scripts/check_no_vendored_env.py

      - name: Every test function carries #[test] — self-test, then the gate
        if: ${{ !cancelled() }}
        run: |
          python scripts/check_unregistered_tests.py --self-test
          python scripts/check_unregistered_tests.py

      # SCRUBGUARD on the lane that matters most: every commit that has ever
      # carried the forbidden trailer was authored on this platform. A gate
      # watching only ubuntu would have watched the one place the violation
      # does not originate. Needs full history, and refuses to run without it.
      - name: Commit messages carry no session trailer
        if: ${{ !cancelled() }}
        run: |
          python scripts/check_commit_trailers.py --self-test
          python scripts/check_commit_trailers.py
          python scripts/check_scrub_trigger.py --self-test
          python scripts/check_scrub_trigger.py

      # check_private_paths.py ALSO BELONGS ON THIS LANE, and the lane-coverage
      # gate is what said so: it landed wired to ubuntu only, and main went red
      # with "a gate that cannot fail on a platform is not watching that
      # platform" — the blind spot check_swift_copy_sites.py sat in for its whole
      # life while CI stayed green.
      #
      # ⛔ WHAT THIS LANE DOES *NOT* DO, corrected here because the first version
      # of this comment claimed it and a reader would have believed it: RUNNING
      # THIS GATE ON WINDOWS DOES NOT MAKE IT SEE A BACKSLASH. Measured by the
      # gate's author, not reasoned: both arms read git OBJECT bytes, diff path
      # headers are forward-slash on every platform, and core.autocrlf rewrites
      # the WORKING TREE, which this gate never reads. The same regex over the
      # same objects returns the same verdict wherever it executes.
      #   ⇒ A LANE CHANGES WHERE A GATE RUNS; ONLY THE PATTERN CHANGES WHAT IT
      #     CAN MATCH. Separator blindness is a PATTERN fix and is tracked as one.
      #
      # So why keep the lane? Because the verdict's platform-invariance is a
      # property of TODAY's implementation, not a guarantee of the gate's
      # contract — this is the lane whose non-UTF-8 default encoding is asserted
      # above, and the first pattern or decoding change that becomes
      # platform-sensitive is watched here BY CONSTRUCTION instead of by someone
      # remembering to add a lane at the same time.
      #
      # Range logic mirrors scrub.yml deliberately rather than being shared: a
      # full-history scan is permanently red here (five pre-ruling commits carry
      # a commons path, measured before that gate shipped), so both lanes scan
      # "no NEW path enters" and both must fall back the same way.
      - name: No NEW path into the private record (Windows lane)
        if: ${{ !cancelled() }}
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python scripts/check_private_paths.py --self-test
          sh scripts/pick_scan_range.sh --self-test
          # ⛔ THE HEAD~100 FALLBACK WAS A GUARANTEED RED, NOT A COVERAGE LIMIT.
          # On a new branch or a pull_request, github.event.before is empty, so
          # the old fallback scanned 100 commits back -- reaching PRE-RULING
          # history, where five commits legitimately carry a commons path. It
          # fired on the first branch pushed after this gate landed and found 3
          # of them. That is the red-sweep-gets-abandoned failure this gate's own
          # header names as the reason it scans a delta at all, re-created by its
          # fallback.
          #
          # The delta a branch push actually introduces is measured against main,
          # not against a commit count. merge-base, so a stale branch scans what
          # IT added rather than what main did meanwhile.
          # ⛔ THIS LANE'S COPY WAS THE STALE ONE -- no reachability arm, no
          # merge-base degeneracy arm; the 08/25 hardening never reached it, so
          # it would still die with git exit 128 on a rewritten before-sha. One
          # copy now, self-tested, shared with scrub.yml.
          RANGE="$(scripts/pick_scan_range.sh)" || exit 1
          echo "scanning $RANGE"
          python scripts/check_private_paths.py --range "$RANGE"

      - name: Untracked files are invisible to index-reading gates
        if: ${{ !cancelled() }}
        run: |
          python scripts/check_index_blindspot.py --self-test
          python scripts/check_index_blindspot.py

      - name: A gate that asserts cannot be skipped into silence
        if: ${{ !cancelled() }}
        run: |
          python scripts/check_gate_cannot_skip.py --self-test
          python scripts/check_gate_cannot_skip.py

      - name: Corpus coverage of the analytic law's clauses
        if: ${{ !cancelled() }}
        run: |
          python scripts/check_spec_mutation_coverage.py --self-test
          python scripts/check_spec_mutation_coverage.py

      - name: Structural gates
        if: ${{ !cancelled() }}
        run: |
          bash scripts/check_workspace_json.sh
          python scripts/check_menu_structure.py
          python scripts/check_toolbar_structure.py
          python scripts/check_action_refs.py
          bash scripts/check_panel_goldens.sh
          python scripts/check_path_b_exclusions.py
          bash scripts/check_intent_map.sh
          python scripts/check_preservation_corpus.py
          python scripts/check_corpus_manifest.py --self-test
          python scripts/check_corpus_manifest.py
          # Added here after this gate landed 2026-07-28 keyed on str(Path) and
          # failed WHOLESALE on Windows while CI stayed green — it runs in the
          # ubuntu job, and ubuntu is the platform that cannot see the defect.
          # A path-keyed gate belongs on the platform whose paths differ.
          python scripts/check_swift_copy_sites.py --self-test
          python scripts/check_swift_copy_sites.py
          # Same argument as the two lines above, one level up: this asserts no
          # gate is watched on only one platform family. It reports its own
          # absence, so it must appear in both lanes or it fails immediately.
          python scripts/check_lane_coverage.py --self-test
          python scripts/check_lane_coverage.py
          # The step-level half of the same argument, and it judges THIS lane:
          # check_lane_coverage.py asserts every gate is watched on both
          # platform families, and this asserts that being in the list is
          # enough to actually run. A gate present in a lane that aborts above
          # it is watched on paper only.
          python scripts/check_step_cannot_hide.py --self-test
          python scripts/check_step_cannot_hide.py
          python scripts/check_geometry_checkers.py --self-test
          python scripts/check_geometry_checkers.py
          python scripts/check_element_dispatch.py --self-test
          python scripts/check_element_dispatch.py
          python scripts/check_bounds_resolver_ledger.py --self-test
          python scripts/check_bounds_resolver_ledger.py
          python scripts/check_selection_invariant.py --self-test
          python scripts/check_selection_invariant.py
          python scripts/check_widget_kind_dispatch.py --self-test
          python scripts/check_widget_kind_dispatch.py
          python scripts/check_layers_type_filter.py --self-test
          python scripts/check_layers_type_filter.py
          python scripts/check_action_implementations.py --self-test
          python scripts/check_action_implementations.py
          python scripts/check_path_keying.py --self-test
          python scripts/check_path_keying.py
          python scripts/check_set_document_bracketing.py --self-test
          python scripts/check_set_document_bracketing.py
          python scripts/check_deferral_expiry.py --self-test
          python scripts/check_deferral_expiry.py
          python scripts/check_gate_consistency.py --self-test
          python scripts/check_gate_consistency.py
          # Reads Rust source and fixture JSON with explicit encoding, and keys
          # its families on os.path.relpath output normalised to '/', so it
          # should be separator- and codepage-clean here. Windows CI is what
          # proves that, not this comment.
          python scripts/check_default_variance.py --self-test
          python scripts/check_default_variance.py
          # Enumerates its subjects with `git ls-files` and compares path
          # PREFIXES ("JasSwift/", "jas_dioxus/") against git's POSIX output --
          # no str(Path) anywhere -- so it should be separator-clean here.
          # Windows CI is what proves that, not this comment.
          python scripts/check_degree_radian_grouping.py --self-test
          python scripts/check_degree_radian_grouping.py
          # Scans git-tracked text via `git ls-files`, which emits POSIX paths on
          # every platform, and compares with PurePosixPath — no str(Path) in the
          # path, so it should be separator-clean here. Windows CI is what proves
          # that, not this comment.
          python scripts/check_naming_rule.py --self-test
          python scripts/check_naming_rule.py

      # cbindgen, for the header-freshness referee below. Prebuilt via binstall
      # (seconds) rather than compiled from source (minutes) — and PINNED, because
      # check_cbindgen_freshness.py REFUSES on any other version: a version bump
      # changes generated formatting and would red the gate for a reason that has
      # nothing to do with the source.
      #
      # The `--version` guard is pages.yml's lesson, not a precaution: a restored
      # cargo cache carries install METADATA without the binary, so a plain
      # `cargo binstall -y` can exit 0 in ~0s while the tool is absent. Trust only
      # a real binary check. The `cargo install` fallback keeps the lane alive if
      # no prebuilt artifact matches this platform.
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cbindgen 0.29.4
        id: cbindgen
        run: |
          if cbindgen --version 2>/dev/null | grep -q '^cbindgen 0\.29\.4$'; then
            echo "cbindgen 0.29.4 already present"
          else
            cargo binstall -y --force cbindgen@0.29.4 \
              || cargo install cbindgen --version 0.29.4 --locked --force
          fi
          cbindgen --version

      # The FFI header is the one generated artifact in this tree with no
      # freshness referee, and it had drifted 16 lines behind src/ffi.rs since
      # 2026-07-29. Nothing in this repository reds when it is stale — the cost
      # lands on a C consumer OUTSIDE the repo — so it needs a referee, not a
      # test. Runs in both platform families; check_lane_coverage.py enforces
      # the pair.
      # COUPLED TO ITS PREMISE, not merely isolated -- and the first version of
      # this step got that wrong in a way CI caught. `!cancelled()` alone freed
      # it from every earlier step INCLUDING its own tool install, so when an
      # unrelated `Structural gates` failure skipped the fail-fast install, this
      # step ran anyway and failed closed on a missing cbindgen: a second red
      # whose real cause was three steps above it. That is precisely the case
      # `Corpus freshness` already handles by coupling to `steps.lf`, written on
      # this same lane and not carried across. Isolation is from UNRELATED
      # steps; a step's own premise is not one of them.
      - name: FFI header matches the Rust it describes
        if: ${{ !cancelled() && steps.cbindgen.conclusion == 'success' }}
        run: |
          python scripts/check_cbindgen_freshness.py --self-test
          python scripts/check_cbindgen_freshness.py

      # These five are the newline half's blast radius: each regenerates a
      # corpus and byte-compares it against the committed golden, so a text
      # write without newline="" turns all five red on data that is current.
      #
      # THE ONE STEP WITH A REAL PREMISE, so it is the one step not isolated
      # from everything. It is isolated from every OTHER step, but stays coupled
      # to the LF preflight: on a CRLF checkout these five would be measuring
      # git's behaviour rather than ours and would fail confusingly — the
      # preflight's own comment says so, and that argument survives the split.
      # Coupling to `steps.lf` keeps the confusing red from being manufactured,
      # while `!cancelled()` still frees it from every unrelated step above.
      - name: Corpus freshness
        if: ${{ !cancelled() && steps.lf.conclusion == 'success' }}
        run: |
          bash scripts/check_expr_corpus.sh
          bash scripts/check_concept_corpus.sh
          bash scripts/check_concept_operations_corpus.sh
          bash scripts/check_concept_fitters_corpus.sh
          bash scripts/check_concept_constraints_corpus.sh

      # The separator half: genericity's exclude patterns are "/"-anchored, and
      # matching them against str(Path) silently no-opped every exclusion here.
      - name: Genericity
        if: ${{ !cancelled() }}
        run: |
          python scripts/genericity_check_test.py
          python scripts/genericity_check.py

      - name: Reference interpreter conformance
        if: ${{ !cancelled() }}
        run: python -m pytest workspace_interpreter/tests -q

      # SPECUNTESTED: the analytic tier is what the geometry checkers RULE BY,
      # and until 2026-08-03 nothing tested it -- there was no test directory
      # under spec/ and CI names its pytest paths explicitly, so a bare
      # `pytest` never reached it either. Named separately from the reference
      # interpreter because it is a different tier with a different job.
      - name: Analytic tier (spec/geometry) conformance
        if: ${{ !cancelled() }}
        run: python -m pytest spec/geometry/tests -q

      - name: Rust tests
        if: ${{ !cancelled() }}
        run: cd jas_dioxus && cargo test

      # The native half of the same claim. Windows is the platform that would
      # ship a frontend-less core, so this lane is where the assertion earns its
      # keep: on 2026-07-29 `cargo test --no-default-features --lib` exited 101
      # here while `cargo check` exited 0, and the divergent text-width arm it
      # was hiding had been live for as long as the gate had not existed.
      - name: Native core tests (no web feature)
        if: ${{ !cancelled() }}
        run: |
          python scripts/check_native_core_tests.py --self-test
          python scripts/check_native_core_tests.py

      # The anti-vacuity half of the step above, which used to be an exact pin
      # on the test count and is now a property with no number in it: every
      # `web` gate on a module or a test item is declared with a reason, and no
      # declaration outlives its gate. Pure source scanning -- it needs no
      # toolchain and would run anywhere -- but it belongs beside its sibling.
      - name: Native test gating (nothing verifiable is hidden behind `web`)
        if: ${{ !cancelled() }}
        run: |
          python scripts/check_native_test_gating.py --self-test
          python scripts/check_native_test_gating.py

      # SINGLE-LANE ORACLE, deliberately without --require-comparisons: there is
      # no Swift toolchain on Windows, so no lane-vs-lane comparison is possible
      # here. The cross-language job below documents this as the legitimate mode
      # for a box with one lane — it checks the PINNED GOLDENS rather than mutual
      # agreement, which is exactly the property a third platform should confirm.
      # The blocking two-lane equivalence gate remains the macOS job; this does
      # not replace it and must not be read as doing so.
      - name: Cross-language — rust oracle against the pinned goldens
        if: ${{ !cancelled() }}
        run: |
          # PRE-BUILD THE BINARIES THE DRIVERS INVOKE, so the first driver call
          # does not compile inside its per-command timeout. This is the repo's
          # own finding #25 and its own remedy -- the macOS `cross-language` job
          # has carried a `Build all` step for exactly this reason since that
          # finding landed. The Windows lane never got one because it never got
          # this far: the step below has been `skipped` behind an earlier failure
          # on every run, so nobody discovered that `cargo run --bin
          # workspace_roundtrip` must COMPILE here first.
          #
          # MEASURED, on this PR's own run: the drivers' 16 oracle checks all
          # PASSED and the step still failed on
          #   subprocess.TimeoutExpired: 'cargo run --bin workspace_roundtrip'
          #   timed out after 30 seconds
          # because a GitHub Windows runner has no cargo cache -- the only cache
          # in this workflow is `cache: pip` -- so every run compiles cold.
          # Raising the timeout would be guessing at a cold-build duration;
          # pre-building removes compilation from the timed window entirely,
          # which is what the macOS job already does.
          # ...and --no-default-features SECOND, because that is the set the next
          # two drivers invoke. The default set is needed only by the workspace
          # runner at the end, which gets its own rebuild below.
          cargo build --bins --manifest-path jas_dioxus/Cargo.toml
          cargo build --bins --no-default-features --manifest-path jas_dioxus/Cargo.toml
          python scripts/lane_report.py --self-test
          python scripts/cross_language_algorithms.py --lang rust --checker-report checker-report.json
          # The geometry checkers ride SEAM 1 — the out-of-process roundtrip
          # wire — so ONE Python predicate adjudicates them and this box can
          # referee them in full, with no Swift toolchain. That is the whole
          # argument for Seam 1: a Seam-2 checker would show Windows the Rust
          # arm alone, half-watched by construction.
          python scripts/check_geometry_checkers.py --reconcile checker-report.json
          python scripts/cross_language_commutativity.py --lang rust
          # RE-BUILD, because the line above just invalidated the first one.
          # cross_language_commutativity.py invokes `cargo run --bin svg_roundtrip
          # --no-default-features` -- a DIFFERENT feature set, so cargo rebuilds
          # the graph without `web`, and the default-features build this step
          # pre-made at the top is no longer current. The next call then pays a
          # full rebuild inside its own 30s timeout and dies there.
          #
          # MEASURED on this branch's first attempt: the top-of-step pre-build
          # reported `Finished in 0.37s` (nothing to do), commutativity passed its
          # 16 checks, and `cargo run --bin workspace_roundtrip` STILL timed out at
          # 30s. So compilation was not removed from the window -- it was moved
          # back into it by the feature switch in between.
          #
          # Deterministic rather than a larger timeout: a bigger number would be a
          # guess at a cold Windows rebuild (flask measured ~90s for a full cold
          # build here), and it would let a silent recompile keep hiding inside a
          # step that is supposed to be measuring agreement. Note both drivers pass
          # `-q`, so a rebuild emits no `Compiling` lines at all -- absence of them
          # in a log is not evidence that none happened.
          cargo build --bins --manifest-path jas_dioxus/Cargo.toml
          python scripts/cross_language_workspace.py --lang rust

  # THE HALF NOTHING HAD EVER COMPILED. `--features d2d` and `--features ffi`
  # were never built by any job in this workflow, so the Direct2D backend and the
  # extern "C" surface were carried as source with no evidence they compiled at
  # all, let alone passed.
  #
  # A SEPARATE JOB, NOT A STEP IN `windows`, AND THE REASON IS MEASURED. On run
  # 32671926038 (green main, e4a3e874) the `windows` job took 500s and was the
  # critical path -- the next longest job was 327s. Adding this work as a step
  # there would extend the whole workflow's wall clock by its full duration; as a
  # parallel job it costs additional runner minutes and NO wall clock, because it
  # finishes well inside the 500s already being spent.
  #
  # ONE JOB FOR BOTH FEATURES, not one each. CI has no cargo cache at all (the
  # only cache in this workflow is `cache: pip`), so every run compiles cold, and
  # a cold build is dominated by the dependency tree rather than by the feature.
  # Measured cold on the Windows seat over six builds: default 86s, d2d 91s, ffi
  # 89s, d2d+ffi 90s, all within +-5s. So a second lane would cost an entire
  # additional cold build to buy ~1s of feature compilation.
  #
  # NO `needs:`, DELIBERATELY. A job with no dependency cannot be skipped into
  # silence by one, which is the failure check_gate_cannot_skip.py exists to
  # catch. This lane reports its own verdict or it reports nothing.
  windows-native:
    name: Native backends (Direct2D + FFI, the half nothing compiled)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # For the lane guard below, which is stdlib-only ON PURPOSE: this job runs
      # no `pip install -r requirements.txt`, which costs 28s in the `windows`
      # job. A guard that needed the project's dependency set would have made
      # this lane pay for a toolchain it does not use.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `--no-default-features` drops the dioxus/wasm graph neither backend
      # needs; the `web` configuration is already covered by the `windows` job's
      # own `cargo test`. ONE cargo invocation, ONE feature set -- so nothing in
      # this job can invalidate a build a later step depends on, which is the
      # shape that made `cross_language_workspace.py` time out one lane over.
      #
      # `tee` under `set -o pipefail` so the log is captured WITHOUT discarding
      # cargo's exit status. Without pipefail the pipeline would report tee's
      # status and a failing test suite would read as green.
      - name: Direct2D and FFI backends compile, and their tests execute
        id: nativetests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --no-default-features --features d2d,ffi \
            --manifest-path jas_dioxus/Cargo.toml 2>&1 | tee native-lane.log

      # THE ANTI-VACUITY HALF, and the reason this job is not just `cargo test`.
      # painter/mod.rs:281 is `#[cfg(all(feature = "d2d", windows))]`, so this
      # lane on a non-Windows runner would enable the feature, compile none of
      # the 1,958 lines, run the suite, print the baseline test total and exit 0.
      # Exit status, duration and test count all read as success; only a named
      # test that could not have been built otherwise can tell the difference.
      #
      # COUPLED TO ITS OWN PREMISE, per the lesson the cbindgen step recorded
      # above: `!cancelled()` alone would free this from the cargo step that
      # PRODUCES its evidence, and a compile failure would then surface as a
      # second red about a missing log. Isolation is from unrelated steps; a
      # step's own premise is not one of them.
      - name: The lane ran the backends it is named for
        if: ${{ !cancelled() && steps.nativetests.conclusion == 'success' }}
        run: |
          python scripts/check_native_backend_lane.py --self-test
          python scripts/check_native_backend_lane.py \
            --profile windows-d2d-ffi --log native-lane.log

  # THE SECOND PLATFORM FAMILY, for the half that has no platform reason to be
  # Windows-only. `feature = "ffi"` carries no cfg at all -- unlike d2d it
  # compiles everywhere -- so watching it on Windows alone would be watching it
  # on one family by accident, which is the hole check_lane_coverage.py exists to
  # forbid. It is also what lets the lane guard satisfy that gate honestly rather
  # than by taking the first EXEMPT row in a file that has deliberately kept it
  # empty.
  #
  # UBUNTU, NOT MACOS: the surface is platform-neutral, so this buys the same
  # evidence on the cheapest and fastest runner family available.
  native-ffi:
    name: FFI surface on the second platform family
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `set -o pipefail` is spelled out rather than assumed: a step with no
      # `shell:` key runs under `bash -e {0}` on Linux, which does NOT set
      # pipefail, so `cargo test | tee` would report tee's exit status and a
      # failing suite would read as green.
      - name: The FFI surface compiles and its tests execute
        id: ffitests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --no-default-features --features ffi \
            --manifest-path jas_dioxus/Cargo.toml 2>&1 | tee ffi-lane.log

      - name: The lane ran the surface it is named for
        if: ${{ !cancelled() && steps.ffitests.conclusion == 'success' }}
        run: |
          python scripts/check_native_backend_lane.py --self-test
          python scripts/check_native_backend_lane.py \
            --profile ffi-second-family --log ffi-lane.log

  rust:
    name: Rust tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd jas_dioxus && cargo test
      # cbindgen, for the header-freshness referee below. Prebuilt via binstall
      # (seconds) rather than compiled from source (minutes) — and PINNED, because
      # check_cbindgen_freshness.py REFUSES on any other version: a version bump
      # changes generated formatting and would red the gate for a reason that has
      # nothing to do with the source.
      #
      # The `--version` guard is pages.yml's lesson, not a precaution: a restored
      # cargo cache carries install METADATA without the binary, so a plain
      # `cargo binstall -y` can exit 0 in ~0s while the tool is absent. Trust only
      # a real binary check. The `cargo install` fallback keeps the lane alive if
      # no prebuilt artifact matches this platform.
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cbindgen 0.29.4
        run: |
          if cbindgen --version 2>/dev/null | grep -q '^cbindgen 0\.29\.4$'; then
            echo "cbindgen 0.29.4 already present"
          else
            cargo binstall -y --force cbindgen@0.29.4 \
              || cargo install cbindgen --version 0.29.4 --locked --force
          fi
          cbindgen --version

      # The FFI header is the one generated artifact in this tree with no
      # freshness referee, and it had drifted 16 lines behind src/ffi.rs since
      # 2026-07-29. Nothing in this repository reds when it is stale — the cost
      # lands on a C consumer OUTSIDE the repo — so it needs a referee, not a
      # test. Runs in both platform families; check_lane_coverage.py enforces
      # the pair.
      - name: FFI header matches the Rust it describes
        run: |
          python3 scripts/check_cbindgen_freshness.py --self-test
          python3 scripts/check_cbindgen_freshness.py

      # The core must also build and pass WITHOUT the `web` feature. D1
      # (2026-07-29) keeps this core for port six, so it has to be verifiable on
      # a platform with no frontend. Runs in this lane and in the Windows lane;
      # check_lane_coverage.py enforces the pair.
      - name: Native core tests (no web feature)
        run: |
          python3 scripts/check_native_core_tests.py --self-test
          python3 scripts/check_native_core_tests.py

      # Its anti-vacuity partner. Runs in both lanes for the same reason the
      # step above does: the ledger it reads is shared, so a row paid off on one
      # platform must go stale on both.
      - name: Native test gating (nothing verifiable is hidden behind `web`)
        run: |
          python3 scripts/check_native_test_gating.py --self-test
          python3 scripts/check_native_test_gating.py

  # The shared reference interpreter lives in workspace_interpreter/ — the
  # exact modules (effects, state_store, scope, doc_primitives, loader, expr)
  # every native app mirrors. It stays LIVE and BLOCKING under the
  # five-port-parity freeze (POLICY.md): it is the spec's executable meaning
  # and the corpus-authoring substrate.
  workspace-interpreter:
    name: Reference interpreter conformance (Python reference)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install from requirements.txt so the CI deps cannot drift from what
      # the code actually imports.
      - run: pip install -r requirements.txt
      - run: python -m pytest workspace_interpreter/tests
      - run: python -m pytest spec/geometry/tests

  # The jas/ Qt app is FROZEN at the five-port-parity tag (POLICY.md): this
  # lane checks out the WHOLE repo at the tag — not just fixtures — because
  # the app imports live workspace_interpreter modules, so a HEAD checkout
  # would mix frozen app code with an evolving interpreter. Tag-pinned, the
  # job can only red on toolchain drift, which is exactly the canary signal;
  # continue-on-error keeps frozen-lane noise from blocking active work
  # (same pattern as the flask job).
  python-canary:
    name: Python Qt app (frozen toolchain canary)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: five-port-parity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Preflight — pinned inputs present
        run: test -f workspace/workspace.json && test -d test_fixtures/algorithms
      - run: cd jas && python -m pytest

  # jas_ocaml is FROZEN at the five-port-parity tag (POLICY.md): whole-repo
  # tag checkout pins its sources, test_fixtures/, and workspace/workspace.json
  # together. The preflight guards against a botched pin: several OCaml suites
  # Alcotest.skip (or pass vacuously) when the bundle is missing, so a bad
  # checkout would otherwise go green instead of red.
  ocaml-canary:
    name: OCaml (frozen toolchain canary)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: five-port-parity
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      # alcotest is the test framework the jas_ocaml test/ dune files depend on
      # (libraries jas lablgtk3 alcotest).
      - run: opam install --yes dune lablgtk3 xmlm yojson alcotest msgpck camlzip
      - name: Preflight — pinned inputs present
        run: test -f workspace/workspace.json && test -d test_fixtures/algorithms
      - run: cd jas_ocaml && opam exec -- dune test

  swift:
    name: Swift tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Pin a recent Xcode: Tests/Document/WriteChokepointTests uses swift-testing
      # exit tests (`#expect(processExitsWith:)`), which need Swift 6.2+ (Xcode
      # 26+). The runner default was older, so the whole suite failed to compile.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: cd JasSwift && swift test

  # Flask is a non-gating reference renderer (TESTING_STRATEGY.md §6), so this
  # job does not block the merge (continue-on-error) — but it keeps the flask
  # reference renderer and its parked workspace-spec tests (Path B layout,
  # opacity/artboards/concepts panels) from rotting silently, as they had:
  # a stale test_all_menu_actions_exist was red here for lack of any CI.
  flask:
    name: Flask reference tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r jas_flask/requirements.txt
      - run: cd jas_flask && python -m pytest tests/

  # Blocking equivalence lane for the ACTIVE ports (Rust, Swift) per the
  # five-port-parity freeze (POLICY.md). The frozen ports' equivalence is
  # preserved at the tag their canary lanes check out; every driver cell here
  # is anchored to pinned goldens, not mutual agreement.
  cross-language:
    name: Cross-language equivalence (active ports)
    # `needs:` ORDERS this job; it must never SILENCE it. Without the `if:`,
    # a red `rust` or `swift` job skips this one, and GitHub renders a skipped
    # job as neutral -- "0s", which reads as *not applicable* rather than
    # *not checked*.
    #
    # MEASURED, run 31114155047 on 5095060d: the macOS `rust` job died inside
    # cargo's own bookkeeping (`could not parse/generate dep info ... Invalid
    # argument (os error 22)`) before one test ran, and this gate -- the
    # blocking check for the project's prime directive -- was skipped. An
    # unrelated filesystem fault on a runner silenced port-parity for a commit.
    #
    # `!cancelled()` rather than `always()`: an operator who cancels a run means
    # it. A dependency FAILING is not a reason to stop judging; a human pressing
    # cancel is. The job builds its own binaries (see `Build all` below), so it
    # does not need its dependencies to have succeeded in order to be correct --
    # only to have finished, which is what `needs:` still buys.
    #
    # scripts/check_gate_cannot_skip.py asserts this property so it cannot be
    # dropped silently, and distinguishes a job that JUDGES (must not skip) from
    # one that ACTS (pages.yml's deploy, which must).
    needs: [rust, swift]
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pre-build exactly the binaries the equivalence drivers invoke, so the
      # first driver call does not compile inside its per-command timeout
      # (finding #25). The drivers run `swift run AlgorithmRoundtrip` (DEBUG)
      # and `cargo run --bin ...` — so the Swift build must be DEBUG (the old
      # `swift build -c release` left the debug binary to compile on-demand,
      # timing out `measure swift` after 60s).
      - name: Build all
        run: |
          # BUILD THE CONFIGURATION THE DRIVERS ACTUALLY RUN. Both rust drivers in
          # this job invoke `--no-default-features`
          # (cross_language_algorithms.py:241, cross_language_commutativity.py:85),
          # so a default-features pre-build leaves every driver call to rebuild
          # inside its own 30s per-command timeout. That is finding #25's remedy
          # applied to the wrong feature set, and here it has been ERRORING rather
          # than failing loudly:
          #   ERROR: s4/leading-close element_bounds rust: 'cargo run --bin
          #   algorithm_roundtrip --no-default-features ...' timed out after 30s
          # Measured on this stack: 1 error against 1861 passing checks -- rare
          # enough to read as noise, and caused by the BUILD, not by disagreement.
          # The no-default build goes LAST so it is the current one when the
          # drivers run.
          (cd jas_dioxus && cargo build --bins)
          (cd jas_dioxus && cargo build --bins --no-default-features)
          (cd JasSwift && swift build)
      # Self-test the summary's own reporting rules before trusting a summary
      # (scripts/lane_report.py). A cloud referee's single-lane replay on
      # 2026-07-27 showed the old line — "410 passed ... x 0 comparisons" —
      # reading like a cross-language pass when zero comparisons had run.
      - name: Self-test the lane-report rules
        run: python scripts/lane_report.py --self-test
      # --require-comparisons: this lane is the BLOCKING cross-language gate,
      # so a run that performed no lane-vs-lane comparison (a lane dropped, a
      # --lang edited down to one) must exit non-zero here rather than pass as
      # an oracle run. Single-lane oracle runs stay legitimate WITHOUT the flag
      # — that is how a Linux box with no Swift checks the pinned goldens.
      # --checker-report / --reconcile: the geometry checkers write down the
      # number of rulings they ACTUALLY performed, per lane, and the gate reads
      # it back (R5). Without the second step the count is printed to a log
      # where nothing asserts on it — which is how a checker lane goes vacuous
      # while every other gate stays green.
      - name: Algorithm equivalence
        run: python scripts/cross_language_algorithms.py --lang rust,swift --require-comparisons --checker-report checker-report.json
      - name: Geometry checkers — reconcile the executed counts
        run: python scripts/check_geometry_checkers.py --reconcile checker-report.json
      - name: SVG commutativity
        run: python scripts/cross_language_commutativity.py --lang rust,swift --require-comparisons
      - name: Workspace equivalence
        run: |
          # RE-BUILD THE DEFAULT FEATURE SET BEFORE THE TIMED CALL. `Build all`
          # above ends on `--no-default-features`, and both drivers between here
          # and there (algorithms, commutativity) invoke that set -- so the
          # default-features graph is stale by the time we arrive. But
          # cross_language_workspace.py runs `cargo run --bin workspace_roundtrip`
          # with DEFAULT features, so cargo rebuilds it INSIDE that driver's own
          # 30s per-command timeout, on a runner with no cargo cache.
          #
          # MEASURED, not inferred: this reddened main at 9aa5b6b1 and PR #8 at
          # 917e21a9 with the identical traceback --
          #   subprocess.TimeoutExpired: Command '['cargo', 'run', '--bin',
          #   'workspace_roundtrip', '-q', '--', 'default']' timed out after 30s
          #
          # AND MEASURED AT MY OWN HAND, WITH A CONTROL, on a WARM local tree:
          #   --no-default-features build ..... 6.67s
          #   default-features build .......... 25.91s   (1 crate recompiled)
          #   repeat the default build ........  0.09s   <- control: the 26s was real
          # 26s against a 30s timeout on a warm box. A runner is slower and fully
          # cold, which is why this fails INTERMITTENTLY rather than always -- and
          # why raising the timeout only moves the coin-flip.
          #
          # THE WINDOWS LANE ALREADY CARRIES THIS EXACT RE-BUILD, with a comment
          # saying the commutativity call "just invalidated the first one". That
          # remedy was written on the lane that happened to bite and never crossed
          # to this one -- finding #25's family, fourth instance. Raising the
          # timeout would be guessing at a cold-build duration; pre-building takes
          # compilation out of the timed window entirely.
          (cd jas_dioxus && cargo build --bins)
          python scripts/cross_language_workspace.py --lang rust,swift --require-comparisons
