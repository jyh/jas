name: Web level 2 (reusable)

# The web app's level-2 suite (docs/TESTING.md section 6): every input script
# through the bundle the caller's `build` job uploaded (`github-pages`), served
# on localhost, in a headless browser. ADVISORY: the step exits 0 once its
# receipt is written. The first log line is the metric board's receipt
# (UI-NIGHTLY v1 suite=web.live). Callers: pages.yml (main) and web-l2.yml
# (pull requests).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  web-l2:
    name: Web level 2 (input scripts through the live app, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned driver dependencies and their browser
        run: |
          python -m pip install -r scripts/web_l2_requirements.txt
          # No --with-deps: the runner already carries the browser's system
          # libraries, and the apt step took 11 of the first run's 11.5 minutes.
          python -m playwright install chromium
      - name: The driver's pure half
        run: python scripts/web_l2_driver.py --self-test
      - name: Fetch the bundle the build job made
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: bundle
      - name: Serve it at the Pages path, on localhost
        run: |
          mkdir -p site/jas
          tar -xf bundle/artifact.tar -C site/jas
          python -m http.server 8080 --bind 127.0.0.1 --directory site > http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/jas/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/jas/ > /dev/null
      # --advisory: the step exits 0 once the receipt is written, and the verdict rides in the
      # receipt. A red check here would make the merge preflight refuse every later web PR.
      # Only a run that wrote no receipt fails the step.
      - name: Every input script through the live web app
        run: |
          python scripts/web_l2_driver.py --url http://127.0.0.1:8080/jas/ \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --receipt web-l2-receipt.txt --artifacts web-l2-artifacts --advisory
      - name: The receipt in the run summary
        if: always()
        run: |
          if [ -f web-l2-receipt.txt ]; then
            { echo '```'; cat web-l2-receipt.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'no receipt was written' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the receipt and any failure's screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-l2
          path: |
            web-l2-receipt.txt
            web-l2-artifacts
          if-no-files-found: warn
