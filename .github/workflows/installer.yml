name: Windows installer zip

# W5, THE INSTALLER (a): a self-contained folder in a zip that a person can
# unzip and run on a machine with no .NET and no Windows App SDK runtime.
# The design block is the seat repo's 2026-11-12 W5 installer design.
#
# This job BUILDS AND CHECKS the artifact. It does not publish a release:
# a public release is the owner's word, not CI's.
#
# What it proves, and what it does not: the LAYOUT check below proves the
# folder holds what the app needs to start (by file name, each one named when
# missing). It does NOT prove the app runs on a clean machine -- this runner
# has the .NET SDK installed, so a launch here could not tell a self-contained
# folder from one that leans on the machine. That proof is a person's run on a
# clean Windows account (the design's slice 3), and nothing here stands in for it.

on:
  pull_request:
    paths:
      - "prototypes/sb_winui/**"
      - "jas_dioxus/**"
      - ".github/workflows/installer.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-installer-zip:
    name: The Windows installer zip builds and holds its files
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The engine, RELEASE, with the same features the harness builds
      # (`cargo build --no-default-features --features d2d,ffi --lib`, the
      # loader's own message in JasCore.cs).
      - name: The engine cdylib builds (release)
        id: engine
        run: |
          set -o pipefail
          (cd jas_dioxus && cargo build --release --no-default-features --features d2d,ffi --lib) 2>&1 | tee engine-build.log

      - name: The shell publishes self-contained
        id: publish
        if: ${{ !cancelled() && steps.engine.conclusion == 'success' }}
        run: |
          set -o pipefail
          dotnet publish prototypes/sb_winui/SbWinUi.csproj -c Release -p:JasPublish=true -o dist/jas 2>&1 | tee publish.log

      # The installed layout: the cdylib beside the exe, and the marker that
      # tells the loader to take it from there (JasCore.InstalledCoreDll).
      - name: Assemble the installed layout
        id: assemble
        if: ${{ !cancelled() && steps.publish.conclusion == 'success' }}
        run: |
          cp jas_dioxus/target/release/jas_dioxus.dll dist/jas/
          printf '{"commit":"%s","built_by":"installer.yml"}\n' "$GITHUB_SHA" > dist/jas/jas-install.json

      # LAYOUT, BY NAME. Every file the app needs to start without the
      # machine's runtimes, each reported by name when absent. The listing is
      # printed first so a wrong expectation here is corrected from the
      # artifact's own bytes, not guessed at.
      - name: The folder holds what the app needs to start
        if: ${{ !cancelled() && steps.assemble.conclusion == 'success' }}
        run: |
          echo "--- dist/jas (top level) ---"
          ls -la dist/jas | head -200
          n=$(ls dist/jas | wc -l)
          if [ "$n" -lt 20 ]; then
            echo "::error::dist/jas holds $n entries; a self-contained publish holds hundreds -- this is not one"
            exit 1
          fi
          missing=0
          for f in SbWinUi.exe jas_dioxus.dll jas-install.json hostfxr.dll coreclr.dll Microsoft.WindowsAppRuntime.dll Microsoft.UI.Xaml.dll; do
            if [ ! -s "dist/jas/$f" ]; then
              echo "::error::MISSING from the installed layout: $f"
              missing=$((missing + 1))
            else
              echo "present: $f"
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Zip
        id: zip
        if: ${{ !cancelled() && steps.assemble.conclusion == 'success' }}
        run: |
          (cd dist && 7z a -tzip ../jas-windows-x64.zip jas > /dev/null)
          ls -la jas-windows-x64.zip

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.zip.conclusion == 'success' }}
        with:
          name: jas-windows-x64
          path: jas-windows-x64.zip
          if-no-files-found: error
