name: Scrub

# EVERY PUSHED BRANCH, DELIBERATELY UNFILTERED.
#
# This workflow exists because the gate it runs was correct and still did not
# stop what it was built to stop. `scripts/check_commit_trailers.py` forbids
# chat-service session URLs in commit messages and file contents; its self-test
# proves it fails on an empty scan and catches both forbidden shapes; run over
# the two commits that carried them, it reports both.
#
# It lived in `test.yml`, whose trigger is `branches: [main]`. A branch pushed
# to origin without a pull request targeting main therefore never ran it, and
# two such branches reached the public remote carrying session URLs. The gate
# was never wrong. Its TRIGGER was -- and no test the gate has could see that,
# because a gate cannot observe whether anything invoked it.
#
# So this workflow is separate from `test.yml` rather than being achieved by
# widening that file's trigger: the Tests workflow carries ~16 jobs including a
# multi-minute Windows lane, and running all of it on every scratch-branch push
# would buy this guarantee at a price nobody would keep paying. A leak guard
# must be cheap enough that no future reader is tempted to narrow it again.
#
# `scripts/check_scrub_trigger.py` asserts that property mechanically, so the
# trigger cannot silently narrow a second time.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede an in-flight run for the same ref; a leak check is only ever
# interesting for the tip.
concurrency:
  group: scrub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-trailers:
    name: commit messages carry no session trailer
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` is load-bearing. A shallow checkout would let the gate
      # scan one commit and report success; the gate refuses to run on one
      # rather than trusting this file to stay right, and check_scrub_trigger.py
      # asserts the pairing so neither half can drift from the other.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      # Both gates prove themselves before either is believed.
      - run: python scripts/check_commit_trailers.py --self-test
      - run: python scripts/check_scrub_trigger.py --self-test
      - run: python scripts/check_commit_trailers.py
      - run: python scripts/check_scrub_trigger.py

  githooks-liveness:
    name: the tracked hooks are live, not merely present
    runs-on: ubuntu-latest
    # This job belongs beside the trailer gate rather than in `test.yml`, for the
    # same reason that gate does: it guards the hook that removes the trailer at
    # the one moment removal is still free, and a guard nobody triggers is not a
    # guard. It is seconds of ubuntu and needs no toolchain.
    #
    # WHY A SHAPE CHECK AND NOT A "DO THE HOOKS RUN" CHECK: `core.hooksPath` is
    # local, untracked configuration, so CI's own clone never has it and never
    # can. What CI *can* assert is that a clone which DID run the fresh-clone
    # step would get live hooks -- entry points present and executable, and no
    # `python3` that resolves on Windows and then refuses to run. The developer
    # half is `--clone`, which is deliberately NOT run here: it would fail on
    # every CI run and teach everyone to ignore this job.
    steps:
      - uses: actions/checkout@v4
      # The gate proves itself before it is believed -- the same pairing the
      # commit-trailers job above uses, including a vacuity arm, because a check
      # that inspects nothing must never report success.
      - run: sh scripts/check_githooks_liveness.sh --self-test
      - run: sh scripts/check_githooks_liveness.sh

  private-paths:
    name: no NEW path into the private record enters a public repo
    runs-on: ubuntu-latest
    # Council 2026-08-25 ruled the firewall line at PATHS and booked this gate
    # as construction. Booked is not built: measured over the 9 commits that
    # landed on saltworks at or after that stamp, THREE carried a path into the
    # private record -- the first 1m41s after the ruling. A rule with no
    # instrument is obeyed for exactly as long as it is remembered.
    #
    # ⛔ RANGE DIVERGES FROM THE JOB ABOVE, AND THE DIVERGENCE IS MEASURED.
    # The sibling trailer gate in this file scans ALL of history here, because
    # this repo's trailer population is zero. This gate cannot: measured before
    # it shipped, FIVE commit messages in this history already carry a path
    # into the commons repo, every one of them genuine and every one predating
    # the 2026-08-25 ruling that forbade them. A full scan would therefore be
    # permanently red -- the red-sweep-gets-abandoned failure the trailer gate's
    # own header describes. So this scans the delta: "no NEW path enters".
    #
    # NOTE ON `pull_request`: this workflow also fires on pull_request, where
    # `github.event.before` is empty and the HEAD~100 fallback takes over. That
    # is the declared coverage limit, stated here rather than discovered.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # BOTH ARMS DRIVEN BEFORE TRUST: a planted path must fail it, a
      # role-worded message must pass it, and the fixtures are the real
      # post-ruling instances rather than invented shapes.
      - run: python scripts/check_private_paths.py --self-test
      # The range picker is a gate too: trusted for its RED, so driven first.
      - run: sh scripts/pick_scan_range.sh --self-test
      - name: scan the pushed delta
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # ⛔ THE HEAD~100 FALLBACK WAS A GUARANTEED RED, NOT A COVERAGE LIMIT.
          # On a new branch or a pull_request, github.event.before is empty, so
          # the old fallback scanned 100 commits back -- reaching PRE-RULING
          # history, where five commits legitimately carry a commons path. It
          # fired on the first branch pushed after this gate landed and found 3
          # of them. That is the red-sweep-gets-abandoned failure this gate's own
          # header names as the reason it scans a delta at all, re-created by its
          # fallback.
          #
          # The delta a branch push actually introduces is measured against main,
          # not against a commit count. merge-base, so a stale branch scans what
          # IT added rather than what main did meanwhile.
          #
          # ⛔ TWO ARMS ADDED BY THE evidence SEAT, 2026-08-25 evening, after a
          # REAL force-push exposed both in the sibling repos. Your reasoning
          # above is unchanged and still correct; these sit under it.
          #
          # (a) A BEFORE-SHA MUST BE REACHABLE, NOT MERELY NON-EMPTY. After a
          #     history rewrite the next push carries a before-sha naming
          #     commits that no longer exist. `<dead-sha>..HEAD` makes git exit
          #     128 and the job REDS with "could not read history" on clean
          #     content. Measured on salt: the trailer job died exactly this way
          #     while the paths job survived, because only one had this check.
          #
          # (b) THE MERGE-BASE ARM DEGENERATES ON THE DEFAULT BRANCH. Force-push
          #     to main itself and merge-base(origin/main, HEAD) IS HEAD, so the
          #     range is empty -- which this gate treats as FATAL by design. The
          #     tip-only arm you already wrote is the right landing place for it;
          #     it just needs to be reachable from the degenerate case too.
          # ⛔ ONE COPY, IN scripts/pick_scan_range.sh, WITH A SELF-TEST. This
          # logic lived here AND in test.yml and the two had DIVERGED: the 08/25
          # hardening landed here only. Both also asked whether BEFORE EXISTS
          # when the question is whether it is an ANCESTOR of HEAD -- split a
          # stacked PR and the removed commits survive on the upper branch, so
          # the range resolves EMPTY and this gate reds on clean content.
          RANGE="$(scripts/pick_scan_range.sh)" || exit 1
          echo "scanning $RANGE"
          python scripts/check_private_paths.py --range "$RANGE"
      - name: tree ratchet -- residue the delta gate already fired on must not survive the next green
        run: |
          # A delta gate charges the commit that ADDS a private path; it cannot charge the tree
          # for KEEPING one. Measured on THIS repo 08/29: the gate fired on the two commits that
          # added a private-record path to a PR branch, and every later commit on that branch
          # reported GREEN -- once the bytes fall into the range BASE the delta is clean. This arm
          # asks the other question: is the TREE clean, against scripts/private_paths_baseline.tsv
          # (absent here on purpose -- main carries zero residue, so ANY finding reds).
          python scripts/check_private_paths.py --tree
      - name: message ratchet -- a violating message must not launder into the next scan's base
        run: |
          # The delta arm charges the push that carries a violating MESSAGE; it cannot
          # charge history for keeping one, so a fired-and-unrepaired message falls
          # into the next scan's BASE and every later push is green over it (the
          # flagship repo measured exactly that on a merge push). Ruled 2026-08-30
          # (council row u), ported here in the same act. Scans EVERY message
          # reachable from HEAD against scripts/private_paths_message_baseline.tsv
          # (sha + shape only -- never the line, which would trip the tree ratchet).
          # Anything NEW reds.
          python scripts/check_private_paths.py --messages

  commit-msg-proof:
    name: the commit-msg proof holds where `python` does not exist
    runs-on: ubuntu-latest
    # ⛔ WHY THIS JOB MASKS AN INTERPRETER INSTEAD OF JUST RUNNING THE PROOF.
    # `prove_commit_msg_scrub.sh` was never run by CI at all, and on 08/26 it had
    # rotted: it invoked the gate as `python` BY NAME, and PHASE 1 -- the RED
    # CONTROL -- reported `ok` WITHOUT THE GATE EVER RUNNING wherever `python`
    # was absent. The live control and the vacuous one print the SAME LINE, so no
    # reading of the log separates them.
    #
    # ⛔⛔ AND A PLAIN CI ARM WOULD NOT HAVE CAUGHT IT. This runner has `python`
    # (setup-python provides it), so the elif would have executed and PHASE 1
    # would have passed for the RIGHT reason -- green either way. The defect was
    # environment-dependent: it appeared only where `python` does not exist, which
    # is a bare macOS shell, and NOT the repo that ships a .venv where it was
    # authored. The inverse of works-on-my-machine.
    # ⇒ THE ARM IS ONLY DISCRIMINATING IF `python` IS MISSING. Measured before
    #   wiring: with `python` masked, the repaired prover exits 0 and the
    #   pre-repair one exits 1. That difference is what this job buys; running the
    #   proof in a normal environment buys none of it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: mask `python`, leaving only python3
        run: |
          mkdir -p "$RUNNER_TEMP/mask"
          printf '#!/bin/sh\necho "python: not found" >&2\nexit 127\n' > "$RUNNER_TEMP/mask/python"
          chmod +x "$RUNNER_TEMP/mask/python"
      # THE MASK IS ASSERTED BEFORE IT IS TRUSTED. A mask that silently failed to
      # apply would make the arm below pass vacuously -- the exact shape this job
      # exists to catch, one level up.
      - name: the mask must actually mask, and python3 must survive it
        run: |
          if PATH="$RUNNER_TEMP/mask:$PATH" python -c "" 2>/dev/null; then
            echo "MASK FAILED: \`python\` still runs -- the arm below would be vacuous."; exit 1
          fi
          PATH="$RUNNER_TEMP/mask:$PATH" python3 -c "" || { echo "python3 must still work"; exit 1; }
          echo "mask OK: python refuses, python3 runs"
      - name: the proof must hold with `python` masked
        run: PATH="$RUNNER_TEMP/mask:$PATH" sh .githooks/prove_commit_msg_scrub.sh
      # ...and in an ordinary environment too, so the mask cannot become the only
      # configuration the proof is ever exercised in.
      - name: and in an ordinary environment
        run: sh .githooks/prove_commit_msg_scrub.sh
