<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 200 100" width="200" height="100">
  <g inkscape:groupmode="layer" inkscape:label="Stage">
    <g id="back_cluster" inkscape:label="Back">
      <rect id="a" x="0" y="0" width="10" height="10" fill="rgb(255,0,0)" stroke="none"/>
      <rect id="b" x="20" y="0" width="10" height="10" fill="rgb(0,255,0)" stroke="none"/>
    </g>
    <g id="front_cluster" inkscape:label="Front">
      <rect id="c" x="40" y="0" width="10" height="10" fill="rgb(0,0,255)" stroke="none"/>
      <rect id="d" x="60" y="0" width="10" height="10" fill="rgb(255,255,0)" stroke="none"/>
    </g>
  </g>
</svg>
