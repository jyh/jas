[package]
name = "pen_spike"
version = "0.1.0"
edition = "2021"
description = "Arc 2 prototype #2: pen-latency measurement plumbing — a cross-platform QPC latency ledger + a Windows-only raw WM_POINTER + wgpu ink-trail probe, for the ratified sub-20ms pen pipeline."
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "pen_spike"
path = "src/lib.rs"

[[bin]]
name = "pen_spike"
path = "src/main.rs"

# Pure-logic library deps only — these compile on every host, so the Mac
# `cargo test` builds the ledger/stats/report layer with no Win32 or GPU stack.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The measurement binary is Windows-only (raw Win32 pointer input + wgpu on
# WARP). Target-gating these keeps the Mac `cargo test` lean and lets the bin
# compile to a stub on non-Windows hosts. Versions match the VM's warm cache.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_UI_Controls",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }
wgpu = "30"
raw-window-handle = "0.6"
pollster = "1"
bytemuck = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
