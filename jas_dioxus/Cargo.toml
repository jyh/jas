[package]
name = "jas_dioxus"
version = "0.1.0"
edition = "2024"

[lib]
name = "jas_dioxus"
path = "src/lib.rs"
# cdylib for the S-A boundary spike (feature = "ffi"). rlib stays first so
# every existing consumer -- bins, tests, benches -- is unaffected.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "jas_dioxus"
path = "src/main.rs"
required-features = ["web"]

[[bin]]
name = "svg_roundtrip"
path = "src/bin/svg_roundtrip.rs"

[[bin]]
name = "workspace_roundtrip"
path = "src/bin/workspace_roundtrip.rs"
# It calls `jas_dioxus::workspace::*`, and `workspace` is `feature = "web"`-gated
# at the crate root. Without this, `cargo build --no-default-features` failed
# with ten E0433s from one cause. `svg_roundtrip` and `algorithm_roundtrip`
# deliberately carry no such line: both build natively and should keep doing so.
required-features = ["web"]

[[bin]]
name = "algorithm_roundtrip"
path = "src/bin/algorithm_roundtrip.rs"

[[bin]]
name = "corpus_replay"
path = "src/bin/corpus_replay.rs"
required-features = ["web"]

# R10 de-risking-spike bench: native scene-BUILD cost through the no-op Painter
# sink. Custom harness (no criterion dependency) so `cargo test` stays lean;
# run with `cargo bench --bench painter_build`.
[[bench]]
name = "painter_build"
path = "benches/painter_build.rs"
harness = false

[features]
default = ["web"]
# The extern "C" surface for a native shell. Additive and off by default.
ffi = []
# The Direct2D backend for the ratified Painter seam (B1). Additive, off by
# default; its deps are target-gated to Windows at the foot of this file.
d2d = ["dep:windows", "dep:windows-numerics"]
web = ["dep:dioxus", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:dioxus-logger", "dep:console_error_panic_hook"]

[dependencies]
dioxus = { version = "0.7", features = ["web"], optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "CanvasWindingRule",
    "ImageData",
    "MouseEvent",
    "KeyboardEvent",
    "DomRect",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "DomTokenList",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "FileReader",
    "FileList",
    "File",
    "Event",
    "InputEvent",
    "Navigator",
    "Clipboard",
    "TextMetrics",
    "Storage",
] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rmpv = { version = "1", features = ["with-serde"] }
flate2 = "1"
# Persistent map for the id->element index (REFERENCE_GRAPH.md §2.4): O(log n)
# ops, O(1) structure-sharing clone, sorted iteration, WASM-clean. Backs the
# Model's `IdIndex` so undo snapshots carry the index in O(1).
rpds = "1.2"
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
log = "0.4"
dioxus-logger = { version = "0.6", optional = true }
# Routes Rust panics to the browser console with the panic message + Rust
# source location, so a panic in an event handler surfaces a diagnosable error
# instead of a silent wasm abort ("unreachable"). set_once() in main().
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
dioxus-sdk = "0.6"

# ⛔ THE HARNESS THIS REPO HAD NONE OF. Until 2026-08-28 there was no
# wasm-bindgen-test dependency and no wasm job, so NOTHING in the canvas path
# was executable by any suite — which is half of why defect D-β (the mask
# scratch singleton) survived to be found by reading rather than by a red test.
# The other half was that B1 counted zero mask ops in the display-list corpus.
# The defect sat where BOTH instruments were blind.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# B1 -- Direct2D / DirectWrite / WIC, behind feature = "d2d".
# windows-numerics is a SEPARATE crate: there is no D2D_POINT_2F in windows
# 0.62, every point is windows_numerics::Vector2.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    # FOR THE TESTS, NOT FOR PRODUCTION -- and the distinction is worth the line.
    # The swapchain route (surface.rs) receives a DXGI surface the HOST created
    # and reaches its device via IDXGIDeviceSubObject::GetDevice, so shipping
    # code never calls D3D11CreateDevice. The tests must FABRICATE a device to
    # have a surface at all, and they use the WARP software adapter so they need
    # no GPU and can run on a headless runner.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
] }
windows-numerics = { version = "0.3", optional = true }
